function viewTendencia(){
  const yr = TODAY.slice(0,4);
  const cur = mondayOf(TODAY);
  let mons = []; let mm = mondayOf(`${yr}-01-01`); if (mm < `${yr}-01-01`) mm = addDays(mm, 7);
  for (; mm.slice(0,4) === yr; mm = addDays(mm, 7)) mons.push(mm);
  const done = mons.filter(x => x <= cur).length;
  const lw = lifeWeek(S.cfg.birth), ew = lifeWeek(S.cfg.emiliaBirth);
  const heatColor = v => `color-mix(in oklab, var(--lake) ${Math.round(15 + v*85)}%, var(--cell))`;
  const yearCells = mons.map(x => {
    if (x > cur) return `<span class="wk future" aria-hidden="true"></span>`;
    const s = scoreWeek(x), lbl = `Semana del ${fmtDM(x)}: ${s ? pct(s.overall) : 'sin registro'}`;
    return `<button class="wk ${x === cur ? 'now' : ''} ${s ? '' : 'none'}" ${s ? `style="background:${heatColor(s.overall)}"` : ''} data-act="goto-week" data-m="${x}" title="${lbl}" aria-label="${lbl}" ${x < MIN_MONDAY ? 'disabled' : ''}></button>`;
  }).join('');

  const ms = recentMondays(12);
  const pts = ms.map(x => ({m:x, s:scoreWeek(x)}));
  const hasData = pts.some(p => p.s);
  const complete = pts.filter(p => p.s && p.s.complete);
  let line;
  if (complete.length < 2) line = 'Con dos o tres semanas registradas empieza a dibujarse la línea. No hace falta llenar todo: con lo que marques basta.';
  else {
    const last = complete.slice(-3), prev = complete.slice(-6, -3);
    const a = avg(last.map(p => p.s.overall));
    if (!prev.length) line = `Tus últimas semanas promedian ${pct(a)}. Pronto habrá con qué comparar.`;
    else {
      const b = avg(prev.map(p => p.s.overall)), dlt = a - b;
      line = dlt > 0.05 ? `Va hacia arriba: tus últimas semanas promedian ${pct(a)}, frente a ${pct(b)} antes.`
           : dlt < -0.05 ? `Bajó un poco: ${pct(a)} frente a ${pct(b)}. Es información, no un veredicto. ¿Qué ancla cuidarías primero?`
           : `Estable alrededor de ${pct(a)}. La constancia también es tendencia.`;
    }
    const agg = {};
    for (const p of last) for (const k in p.s.areas) (agg[k] || (agg[k] = [])).push(p.s.areas[k]);
    const ranked = Object.entries(agg).map(([k,v]) => [k, avg(v)]).sort((x,y) => y[1] - x[1]);
    if (ranked.length >= 2) line += ` Lo que más se sostiene: <b>${FRENTES[ranked[0][0]]}</b>. Lo que pide un poco de cariño: <b>${FRENTES[ranked[ranked.length-1][0]]}</b>.`;
  }

  const hm = recentMondays(8), areaKeys = Object.keys(FRENTES).filter(k => hm.some(x => { const s = scoreWeek(x); return s && k in s.areas; }) || activeAnchors().some(a => a.area === k) || activeRhythms().some(r => r.area === k));
  const heat = `<div class="heat" style="grid-template-columns:minmax(96px,150px) repeat(${hm.length},minmax(28px,1fr))">
    <span></span>${hm.map(x => `<span class="hh">${fmtDM(x)}</span>`).join('')}
    ${areaKeys.map(k => `<span class="hl">${FRENTES[k]}</span>${hm.map(x => { const s = scoreWeek(x), v = s && s.areas[k];
      return typeof v === 'number' ? `<span class="hc" style="background:${heatColor(v)}" title="${FRENTES[k]}, semana del ${fmtDM(x)}: ${pct(v)}"></span>` : `<span class="hc na" title="Sin registro"></span>`; }).join('')}`).join('')}
  </div>`;

  const tableRows = ms.slice().reverse().filter(x => S.weeks[x]).map(x => {
    const s = scoreWeek(x), sl = weekSleep(x), oc = weekOcio(x);
    return `<tr><td>${fmtDM(x)}${x === cur ? ' (en curso)' : ''}</td><td>${s ? pct(s.overall) : '–'}</td><td>${sl.length ? fmtNum(avg(sl),1) + ' h' : '–'}</td><td>${oc ? fmtMin(oc) : '–'}</td></tr>`;
  }).join('');

  return `
  <section class="year">
    <div class="block-h"><h2>${yr} en semanas</h2><span class="hint">Cada cuadro es una semana. Llevas ${done} de ${mons.length}; más intenso, más equilibrio.</span></div>
    <div class="yeargrid">${yearCells}</div>
    ${lw ? `<div class="lifeline"><span class="meta">Semana ${fmtNum(lw)} de unas 4000${ew ? ` · Emilia: semana ${fmtNum(ew)}` : ''}</span><div class="bar"><span style="width:${Math.min(100, lw/40)}%"></span></div></div>`
         : `<p class="hint">Añade tu fecha de nacimiento en <a href="#ajustes">Ajustes</a> para ver en qué semana de tu vida estás.</p>`}
  </section>

  <section class="block">
    <div class="block-h"><h2>Balance semanal</h2><span class="hint">Últimas 12 semanas. El punto hueco es la semana en curso.</span></div>
    ${hasData ? spark(pts) : '<p class="empty">Aquí aparecerá tu línea cuando marques tus primeros días.</p>'}
    <p class="trendline">${line}</p>
  </section>

  ${hasData ? `<section class="block">
    <div class="block-h"><h2>Por área</h2><span class="hint">Últimas 8 semanas. Una semana floja en un área no borra las demás.</span></div>
    <div class="scroll">${heat}</div>
    <div class="scale"><span>menos</span>${[0,.33,.66,1].map(v => `<i style="background:${heatColor(v)}"></i>`).join('')}<span>más</span><span style="margin-left:12px"><i class="hc na" style="display:inline-block;width:18px;height:12px;border:1px dashed var(--line)"></i> sin registro</span></div>
  </section>
  <section class="block">
    <div class="block-h"><h2>Semana por semana</h2></div>
    <div class="scroll"><table class="weeks"><thead><tr><th>Semana del</th><th>Balance</th><th>Sueño</th><th>Ocio</th></tr></thead><tbody>${tableRows}</tbody></table></div>
  </section>` : ''}`;
}
function spark(pts){
  const W = 640, H = 170, L = 44, R = 14, T = 12, B = 28, n = pts.length;
  const x = i => L + i * (W - L - R) / (n - 1), y = v => T + (1 - v) * (H - T - B);
  let g = '';
  for (const v of [0, .5, 1]) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${Math.round(v*100)} %</text>`;
  for (const i of [0, Math.floor((n-1)/2), n-1]) g += `<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="${i === 0 ? 'start' : i === n-1 ? 'end' : 'middle'}">${fmtDM(pts[i].m)}</text>`;
  const segs = []; let curSeg = [];
  pts.forEach((p,i) => { if (p.s) curSeg.push([x(i), y(p.s.overall)]); else if (curSeg.length){ segs.push(curSeg); curSeg = []; } });
  if (curSeg.length) segs.push(curSeg);
  let paths = '';
  for (const s of segs){
    const d = s.map((p,i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    if (s.length > 1) paths += `<path class="ar" d="${d} L${s[s.length-1][0].toFixed(1)},${y(0)} L${s[0][0].toFixed(1)},${y(0)} Z"/><path class="ln" d="${d}"/>`;
  }
  const dotsSvg = pts.map((p,i) => p.s ? `<circle class="pt ${p.s.complete ? '' : 'open'}" cx="${x(i)}" cy="${y(p.s.overall)}" r="${i === n-1 ? 5 : 3.5}"><title>Semana del ${fmtDM(p.m)}: ${pct(p.s.overall)}</title></circle>` : '').join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Balance semanal de las últimas 12 semanas">${g}${paths}${dotsSvg}</svg>`;
}

const VIEWS = {hoy:viewHoy, semana:viewSemana, mes:viewMes, objetivos:viewObjetivos, tendencia:viewTendencia, ajustes:viewAjustes};

/* ---------- render ---------- */
function render(){
  const ae = document.activeElement, fid = ae && ae.id;
  let ss = null, se = null; try { ss = ae.selectionStart; se = ae.selectionEnd; } catch {}
  const lw = lifeWeek(S.cfg.birth), ew = lifeWeek(S.cfg.emiliaBirth);
  document.getElementById('lifeweeks').innerHTML =
    `${lw ? `Semana ${fmtNum(lw)} de ~4000` : ''}${lw && ew ? ' · ' : ''}${ew ? `Emilia: semana ${fmtNum(ew)}` : ''}${lw || ew ? ' · ' : ''}<span class="save" id="savestate"></span>`;
  document.querySelectorAll('.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.v === S.view ? 'page' : 'false'));
  const v = document.getElementById('view');
  v.innerHTML = `${S.mode === 'connecting' ? '<p class="status">Abriendo tus semanas…</p>' : banner()}<fieldset class="lock" ${canEdit() ? '' : 'disabled'}>${VIEWS[S.view]()}</fieldset>`;
  saveState();
  if (fid){
    const el = document.getElementById(fid);
    if (el && el !== document.activeElement){ el.focus({preventScroll:true}); try { if (ss != null) el.setSelectionRange(ss, se); } catch {} }
  }
}
let toastT = 0;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id;
  const nav = ['day-today','pick-day','week','month','goto-week','confirm-no','cal-once','cal-perms','fit-retry','fit-perms','plan-change','goal-new','goal-edit','goal-edit-no','to-review','show-review','plan-edit','plan-done'];
  if (!canEdit() && !nav.includes(a)) return;
  switch (a){
    case 'pick-day': {
      const n = b.dataset.day; if (!(n <= TODAY && n >= MIN_MONDAY)) break;
      if (mondayOf(n) !== mondayOf(S.day)){ S.editPlan = false; S.showReview = false; }
      S.day = n; ensureWatches();
      if (b.classList.contains('colpick')){
        if (S.view !== 'hoy'){ location.hash = 'hoy'; return; }
        setTimeout(() => window.scrollTo({top:0, behavior:'smooth'}), 0);
      }
      break;
    }
    case 'day-today': S.day = TODAY; S.editPlan = false; S.showReview = false; ensureWatches(); break;
    case 'week': {
      // Same weekday in the previous or next week, never past today.
      let n = addDays(S.day, 7 * b.dataset.n); if (n > TODAY) n = TODAY;
      if (n >= MIN_MONDAY){ S.day = n; S.editPlan = false; S.showReview = false; ensureWatches(); }
      break;
    }
    case 'plan-edit': S.editPlan = true; break;
    case 'plan-done': S.editPlan = false; break;
    case 'show-review': S.showReview = true; break;
    case 'train-done': {
      const dd = b.dataset.day; if (dd > TODAY) break;
      const w = week(mondayOf(dd)), e = Object.assign({}, w.entreno[dd]);
      e.done = !e.done; e.src = 'manual'; w.entreno[dd] = e; saveWeek(mondayOf(dd)); break;
    }
    case 'plan-pick': {
      const p = PLANES[id]; if (!p) break;
      S.cfg.training = {plan:id, dias:p.dias.slice()}; S.pickPlan = false; saveCfg();
      if (S.fit.status === 'ok') fillFromFit(S.fit.days);
      toast(`Plan «${p.nombre}» elegido. Puedes ajustar cada día en Ajustes.`); break;
    }
    case 'plan-change': S.pickPlan = !S.pickPlan; break;
    case 'goal-new': S.goalNew = !S.goalNew; break;
    case 'goal-edit': S.goalEdit = id; break;
    case 'goal-edit-no': S.goalEdit = null; break;
    case 'goal-toggle': {
      const g = S.cfg.goals.find(x => x.id === id); if (!g) break;
      if (!g.activo && S.cfg.goals.filter(x => x.activo).length >= MAX_GOALS){ toast(`Ya tienes ${MAX_GOALS} objetivos activos. Pausa uno antes de activar otro.`); break; }
      g.activo = !g.activo; saveCfg(); break;
    }
    case 'goal-del': S.confirm = 'goal:' + id; break;
    case 'goal-del-yes': S.cfg.goals = S.cfg.goals.filter(x => x.id !== id); S.confirm = null; saveCfg(); break;
    case 'goal-step': {
      const g = S.cfg.goals.find(x => x.id === id); if (!g) break;
      g.actual = Math.round(((typeof g.actual === 'number' ? g.actual : 0) + (+b.dataset.n)) * 100) / 100; saveCfg(); break;
    }
    case 'goal-hito': { const g = S.cfg.goals.find(x => x.id === id); if (!g) break; g.hecho = !g.hecho; g.hecho_fecha = g.hecho ? TODAY : ''; saveCfg(); break; }
    case 'to-review': { const el = document.getElementById('cierre'); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    case 'cal-once': S.cal = {status:'loading'}; calRetried = true; calOnce(S.day); break;
    case 'cal-perms':
      if (!perms) return;
      perms.manage().then(async () => {
        const st = await perms.state('mcp:' + CAL).catch(() => 'unavailable');
        if (st !== 'denied'){ calKey = null; ensureCalWatch(); render(); }
      }, () => toast('Abre el menú Permisos de esta página y activa Google Calendar.'));
      return;
    case 'month': { const n = shiftMonth(S.month, +b.dataset.n); if (n >= MIN_MONTH && n <= MAX_MONTH) S.month = n; break; }
    case 'goto-week': {
      const m = b.dataset.m; if (m < MIN_MONDAY) break;
      S.day = addDays(m, 6) > TODAY ? TODAY : addDays(m, 6); S.editPlan = false; S.showReview = false; ensureWatches();
      if (location.hash !== '#hoy'){ location.hash = 'hoy'; return; }
      window.scrollTo(0,0); break;
    }
    case 'three': { const t = day(S.day).three[+b.dataset.i]; t.d = !t.d; saveWeek(mondayOf(S.day)); break; }
    case 'carry': {
      const pd = addDays(S.day, -1), prev = week(mondayOf(pd)).days[pd]; if (!prev) break;
      const x = day(S.day), items = prev.three.filter(t => t.t.trim() && !t.d).map(t => t.t);
      for (const slot of x.three){ if (!items.length) break; if (!slot.t.trim()){ slot.t = items.shift(); slot.d = false; } }
      saveWeek(mondayOf(S.day)); break;
    }
    case 'anchor': { const x = day(S.day); x.a[id] = !x.a[id]; x.aSrc = Object.assign({}, x.aSrc, {[id]:'manual'}); saveWeek(mondayOf(S.day)); break; }
    case 'cell': { const d = b.dataset.day; if (d > TODAY) break; const x = day(d); x.a[id] = !x.a[id]; x.aSrc = Object.assign({}, x.aSrc, {[id]:'manual'}); saveWeek(mondayOf(d)); break; }
    case 'sleep': { const x = day(S.day), v = +b.dataset.v; x.sleep = x.sleep === v ? null : v; x.sleepSrc = 'manual'; saveWeek(mondayOf(S.day)); break; }
    case 'sleep-fit': {
      const x = day(S.day); if (!x.fit || !x.fit.sue) break;
      x.sleep = Math.round(x.fit.sue.min / 6) / 10; x.sleepSrc = 'fitbit'; saveWeek(mondayOf(S.day)); break;
    }
    case 'fit-retry': fitKey = null; S.fit = {status:'loading', days:{}}; ensureFitWatch(); break;
    case 'fit-perms':
      if (!perms) return;
      perms.manage().then(() => { fitKey = null; ensureFitWatch(); render(); },
        () => toast('Abre el menú Permisos de esta página y activa Fit Bit.'));
      return;
    case 'ocio-type': S.ocioPick = id; break;
    case 'ocio-del': {
      const x = day(S.day);
      x.ocioLog = x.ocioLog.filter(e => e.id !== id);
      if (x.ocioLog.length) x.ocio = ocioSum(x); else delete x.ocio;
      saveWeek(mondayOf(S.day)); break;
    }
    case 'chore': {
      const d = b.dataset.day; if (d > TODAY) break;
      const w = week(mondayOf(d)), arr = w.chores[id] ? w.chores[id].slice() : [], i = arr.indexOf(d);
      if (i >= 0) arr.splice(i, 1); else arr.push(d);
      w.chores[id] = arr.sort(); saveWeek(mondayOf(d)); break;
    }
    case 'chore-day': {
      const c = S.cfg.chores.find(x => x.id === id), n = +b.dataset.d; if (!c) break;
      c.days = c.days.includes(n) ? c.days.filter(x => x !== n) : [...c.days, n].sort();
      saveCfg(); break;
    }
    case 'todo': {
      const t = S.todo.items.find(x => x.id === id); if (!t) break;
      t.done = !t.done; t.doneOn = t.done ? S.day : '';
      const done = S.todo.items.filter(x => x.done).sort((a,b) => a.doneOn < b.doneOn ? -1 : 1);
      if (done.length > 60){ const drop = new Set(done.slice(0, done.length - 60).map(x => x.id)); S.todo.items = S.todo.items.filter(x => !drop.has(x.id)); }
      saveTodo(); break;
    }
    case 'todo-del': S.confirm = 'todo:' + id; break;
    case 'todo-del-yes': S.todo.items = S.todo.items.filter(x => x.id !== id); S.confirm = null; saveTodo(); break;
    case 'rhythm': {
      const d = b.dataset.day; if (d > TODAY) break;
      const w = week(mondayOf(d)), arr = w.rhythms[id] ? w.rhythms[id].slice() : [], i = arr.indexOf(d);
      if (i >= 0) arr.splice(i, 1); else arr.push(d);
      w.rhythms[id] = arr.sort(); saveWeek(mondayOf(d)); break;
    }
    case 'done-del': { day(S.day).done.splice(+b.dataset.i, 1); saveWeek(mondayOf(S.day)); break; }
    case 'kd': {
      const k = b.dataset.k, mo = month(k); mo.done[id] = !mo.done[id]; saveMonth(k);
      if (S.view === 'hoy' && mo.done[id]) toast('Listo. Si necesitas desmarcarla, está en Mes.');
      break;
    }
    case 'kd-del': S.confirm = 'kd:' + id; break;
    case 'kd-del-yes': S.cfg.keyDates = S.cfg.keyDates.filter(x => x.id !== id); S.confirm = null; saveCfg(); break;
    case 'confirm-no': S.confirm = null; break;
    case 'tgt': { const r = S.cfg.rhythms.find(x => x.id === id); if (r){ r.target = Math.max(1, Math.min(7, r.target + (+b.dataset.n))); saveCfg(); } break; }
    case 'cfg-del': S.confirm = `${b.dataset.list}:${id}`; break;
    case 'cfg-del-yes': { const l = b.dataset.list; S.cfg[l] = S.cfg[l].filter(x => x.id !== id); S.confirm = null; saveCfg(); break; }
    default: return;
  }
  render();
});

document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.bind; if (!k || !canEdit()) return;
  switch (k){
    case 'three': day(S.day).three[+el.dataset.i].t = el.value; saveWeek(mondayOf(S.day)); break;
    case 'note': day(S.day).note = el.value; saveWeek(mondayOf(S.day)); break;
    case 'plan': { const m = mondayOf(S.day); week(m).plan.focus[+el.dataset.i] = el.value; saveWeek(m); break; }
    case 'skip': { const m = mondayOf(S.day); week(m).plan.skip = el.value; saveWeek(m); break; }
    case 'review': { const m = mondayOf(S.day); week(m).review[el.dataset.k] = el.value; saveWeek(m); break; }
    case 'plan-next': { const m = addDays(mondayOf(TODAY), 7); week(m).plan.focus[+el.dataset.i] = el.value; saveWeek(m); break; }
    case 'skip-next': { const m = addDays(mondayOf(TODAY), 7); week(m).plan.skip = el.value; saveWeek(m); break; }
    case 'mnote': month(S.month).review.note = el.value; saveMonth(S.month); break;
    case 'an-label': { const a = S.cfg.anchors.find(x => x.id === el.dataset.id); if (a && el.value.trim()){ a.label = el.value; saveCfg(); } break; }
    case 'ocio-draft': S.ocioDraft[el.dataset.k] = el.value; break;
    case 'ot-label': { const t = S.cfg.ocioTypes.find(x => x.id === el.dataset.id); if (t && el.value.trim()){ t.label = el.value; saveCfg(); } break; }
    case 'ch-label': { const c = S.cfg.chores.find(x => x.id === el.dataset.id); if (c && el.value.trim()){ c.label = el.value; saveCfg(); } break; }
    case 'rh-label': { const r = S.cfg.rhythms.find(x => x.id === el.dataset.id); if (r && el.value.trim()){ r.label = el.value; saveCfg(); } break; }
  }
});

document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.bind; if (!k || !canEdit()) return;
  switch (k){
    case 'mrev': month(S.month).review.done = el.checked; saveMonth(S.month); break;
    case 'cfg': S.cfg[el.dataset.k] = el.value; saveCfg(); break;
    case 'cfg-num': { const v = parseFloat(el.value); if (!isNaN(v)){ S.cfg[el.dataset.k] = Math.max(+el.min, Math.min(+el.max, v)); saveCfg(); } break; }
    case 'an-on': { const a = S.cfg.anchors.find(x => x.id === el.dataset.id); if (a){ a.active = el.checked; saveCfg(); } break; }
    case 'train-swap': {
      const dd = el.dataset.day, w = week(mondayOf(dd)), e = Object.assign({}, w.entreno[dd]);
      if (!hasPlan() || !SESIONES[el.value]) break;
      if (el.value === S.cfg.training.dias[dow(dd)]) delete e.cambio; else e.cambio = el.value;
      w.entreno[dd] = e; saveWeek(mondayOf(dd)); break;
    }
    case 'tr-plan':
      S.cfg.training = PLANES[el.value] ? {plan:el.value, dias:PLANES[el.value].dias.slice()} : {plan:'', dias:null}; saveCfg();
      if (S.fit.status === 'ok') fillFromFit(S.fit.days);
      break;
    case 'tr-day': { const i = +el.dataset.i; if (hasPlan() && SESIONES[el.value]){ S.cfg.training.dias[i] = el.value; saveCfg(); } break; }
    case 'goal-tipo': S.goalTipo = el.value; break;
    case 'goal-actual': { const g = S.cfg.goals.find(x => x.id === el.dataset.id), v = parseFloat(el.value); if (g && !isNaN(v)){ g.actual = v; saveCfg(); } break; }
    case 'ch-on': { const c = S.cfg.chores.find(x => x.id === el.dataset.id); if (c){ c.active = el.checked; saveCfg(); } break; }
    case 'rh-on': { const r = S.cfg.rhythms.find(x => x.id === el.dataset.id); if (r){ r.active = el.checked; saveCfg(); } break; }
    case 'an-area': { const a = S.cfg.anchors.find(x => x.id === el.dataset.id); if (a){ a.area = el.value; saveCfg(); } break; }
    case 'rh-area': { const r = S.cfg.rhythms.find(x => x.id === el.dataset.id); if (r){ r.area = el.value; saveCfg(); } break; }
    default: return;
  }
  render();
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); if (!canEdit()) return;
  const t = f.dataset.form;
  if (t === 'done'){
    const i = document.getElementById('done-new'), v = i.value.trim(); if (!v) return;
    day(S.day).done.push(v); i.value = ''; saveWeek(mondayOf(S.day));
  } else if (t === 'kd'){
    const name = document.getElementById('kd-name').value.trim(), dd = parseInt(document.getElementById('kd-day').value, 10);
    if (!name || !(dd >= 1 && dd <= 31)){ toast('Escribe un nombre y un día del mes entre 1 y 31.'); return; }
    S.cfg.keyDates.push({id:uid36(), name, day:dd, kind:document.getElementById('kd-kind').value, amount:document.getElementById('kd-amount').value.trim()});
    saveCfg(); toast('Fecha añadida. Se repetirá cada mes.');
  } else if (t === 'anchor'){
    const i = document.getElementById('an-new'), v = i.value.trim(); if (!v) return;
    S.cfg.anchors.push({id:uid36(), label:v, hint:'', area:'salud', active:true}); saveCfg();
  } else if (t === 'goal-new'){
    const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    const tipo = ['peso', 'numero', 'hito'].includes(val('g-tipo')) ? val('g-tipo') : 'numero';
    const nombre = tipo === 'peso' ? 'Peso' : val('g-nombre').trim(), meta = parseFloat(val('g-meta'));
    if (!nombre){ toast('Escribe un nombre para el objetivo.'); return; }
    if (tipo !== 'hito' && isNaN(meta)){ toast('Escribe la meta como número.'); return; }
    if (tipo === 'peso' && !(meta >= 30 && meta <= 300)){ toast('Escribe un peso meta en kilos, entre 30 y 300.'); return; }
    const activo = S.cfg.goals.filter(g => g.activo).length < MAX_GOALS;
    const g = {id:uid36(), tipo, nombre, frente: FRENTES[val('g-frente')] ? val('g-frente') : 'salud', activo, meta: tipo === 'hito' ? null : meta,
      fecha: val('g-fecha'), unidad: val('g-unidad').trim(), inicio: tipo === 'numero' ? 0 : null, actual: tipo === 'numero' ? 0 : null, hecho:false, creado:TODAY, inicio_fecha:''};
    if (tipo === 'peso'){ const st = pesoStats(g); if (st){ g.inicio = st.last.peso_kg; g.inicio_fecha = st.last.fecha; } }
    S.cfg.goals.push(g); S.goalNew = false; saveCfg();
    toast(activo ? 'Objetivo creado.' : `Objetivo creado en pausa: ya tienes ${MAX_GOALS} activos.`);
  } else if (t === 'goal-edit'){
    const g = S.cfg.goals.find(x => x.id === f.dataset.id); if (!g) return;
    const el = id => document.getElementById(id);
    if (el('ge-nombre')){ const v = el('ge-nombre').value.trim(); if (!v){ toast('Escribe un nombre.'); return; } g.nombre = v; }
    if (el('ge-meta')){
      const v = parseFloat(el('ge-meta').value);
      if (isNaN(v) || (g.tipo === 'peso' && !(v >= 30 && v <= 300))){ toast(g.tipo === 'peso' ? 'Escribe un peso meta en kilos, entre 30 y 300.' : 'Escribe la meta como número.'); return; }
      g.meta = v;
    }
    g.fecha = el('ge-fecha') ? el('ge-fecha').value : g.fecha;
    if (!g.creado) g.creado = TODAY;
    if (g.tipo === 'peso' && typeof g.inicio !== 'number'){ const st = pesoStats(g); if (st){ g.inicio = st.inicio; g.inicio_fecha = st.inicioF; } }
    S.goalEdit = null; saveCfg(); toast('Objetivo guardado.');
  } else if (t === 'ocio'){
    const dr = S.ocioDraft, h = parseInt(dr.h, 10) || 0, mi = parseInt(dr.m, 10) || 0, min = h * 60 + mi;
    if (h < 0 || mi < 0 || min <= 0){ toast('Escribe cuánto duró: horas, minutos o ambos.'); return; }
    if (min > 720){ toast('Son más de 12 horas. Revisa la duración.'); return; }
    const types = S.cfg.ocioTypes, ty = types.find(x => x.id === S.ocioPick) || types[0];
    const x = day(S.day);
    x.ocioLog.push({id:uid36(), t:ty.id, tl:ty.label, min, q:dr.q.trim()});
    x.ocio = ocioSum(x);
    S.ocioDraft = {h:'', m:'', q:''};
    saveWeek(mondayOf(S.day));
  } else if (t === 'ocio-type'){
    const i = document.getElementById('ot-new'), v = i.value.trim(); if (!v) return;
    S.cfg.ocioTypes.push({id:uid36(), label:v}); saveCfg();
  } else if (t === 'todo'){
    const i = document.getElementById('todo-new'), v = i.value.trim(); if (!v) return;
    S.todo.items.push({id:uid36(), t:v, done:false, created:TODAY, doneOn:''}); i.value = ''; saveTodo();
  } else if (t === 'chore'){
    const i = document.getElementById('ch-new'), v = i.value.trim(); if (!v) return;
    S.cfg.chores.push({id:uid36(), label:v, days:[dow(TODAY)], active:true}); saveCfg();
    toast('Tarea añadida para los ' + DOW_LONG[dow(TODAY)] + '. Cambia los días con las letras.');
  } else if (t === 'rhythm'){
    const i = document.getElementById('rh-new'), v = i.value.trim(); if (!v) return;
    S.cfg.rhythms.push({id:uid36(), label:v, area:'desarrollo', target:1, active:true}); saveCfg();
  }
  render();
});

function route(){
  const h = location.hash.slice(1);
  S.view = VIEWS[h] ? h : 'hoy';
  S.confirm = null; S.goalEdit = null;
  if (S.view === 'objetivos') ensurePesoWatch();
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden'){ flushAll(); return; }
  const prev = TODAY; setToday();
  if (prev !== TODAY){
    if (S.day === prev){ S.day = TODAY; ensureWatches(); }
    if (S.month === monthKey(prev)) S.month = monthKey(TODAY);
    render();
  }
});
window.addEventListener('pagehide', flushAll);

route();
connect();
connectCal();
})();
</script>
