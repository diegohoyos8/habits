<title>Habitos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap">
<style>
/* Layout: one calm column (max 720px) under a sticky tab strip. Sections breathe on space and hairlines;
   only "Lo importante hoy" and the year-in-weeks grid are set off as objects. */
:root{
  --paper:#EDF1EF; --surface:#F8FAF9; --ink:#16272A; --muted:#566769; --line:#D2DBD9;
  --lake:#1E5D78; --lake-soft:#D3E4EA; --on-lake:#FFFFFF;
  --ember:#925E10; --ember-soft:#F2E3C6;
  --cell:#DFE7E5;
  --display:"Young Serif","Iowan Old Style",Georgia,serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1618; --surface:#152023; --ink:#E1EAE9; --muted:#93A5A6; --line:#26363A;
    --lake:#7DB8D1; --lake-soft:#183340; --on-lake:#0B1416;
    --ember:#DDA650; --ember-soft:#36290F; --cell:#1B282B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1618; --surface:#152023; --ink:#E1EAE9; --muted:#93A5A6; --line:#26363A;
  --lake:#7DB8D1; --lake-soft:#183340; --on-lake:#0B1416;
  --ember:#DDA650; --ember-soft:#36290F; --cell:#1B282B; color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
h1,h2{font-family:var(--display)}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--lake);outline-offset:2px;border-radius:6px}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:6px;padding-block:12px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.01em}
.brand .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-8px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;padding:8px 10px 10px;text-decoration:none;color:var(--muted);font-size:15px;border-bottom:2px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--lake);font-weight:700}
.save{font-size:12px;color:var(--muted);letter-spacing:.04em}

main.wrap{padding-block:20px 72px;display:flex;flex-direction:column;gap:32px}
fieldset.lock{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:32px}

.banner{background:var(--ember-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:15px}
.status{color:var(--muted);font-size:15px}

/* section heads */
.block{display:flex;flex-direction:column;gap:14px}
.block-h{display:flex;flex-direction:column;gap:2px}
.block-h h2{font-size:22px;line-height:1.2}
.hint{color:var(--muted);font-size:14px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* today head */
.dayhead{display:flex;flex-direction:column;gap:10px}
.dayhead h1{font-size:clamp(26px,6vw,34px);line-height:1.1}
.daynav{display:flex;align-items:center;gap:10px}
.daynav h1{font-size:clamp(26px,6vw,34px);line-height:1.1;flex:1;min-width:0}
.navbtn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1}
.navbtn:disabled{opacity:.35;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--lake);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:15px;align-self:flex-start}
.principle{font-style:italic;color:var(--muted);max-width:60ch}
.weekbox{display:flex;flex-direction:column;gap:10px}
.wkhead{display:flex;align-items:center;gap:10px}
.wkhead .lbl{flex:1;text-align:center;font-size:15px;font-weight:700}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-variant-numeric:tabular-nums;min-width:0}
.wday small{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.wday b{font-weight:700;font-size:18px;line-height:1.2;font-variant-numeric:tabular-nums}
.wday .wb{width:60%;height:3px;border-radius:2px;background:var(--cell);overflow:hidden}
.wday .wb i{display:block;height:100%;background:var(--lake)}
.wday.today{border-color:var(--lake);border-width:2px}
.wday[aria-pressed="true"]{background:var(--lake);border-color:var(--lake);color:var(--on-lake)}
.wday[aria-pressed="true"] small{color:var(--on-lake)}
.wday[aria-pressed="true"] .wb{background:color-mix(in oklab, var(--on-lake) 30%, transparent)}
.wday[aria-pressed="true"] .wb i{background:var(--on-lake)}
.wday:disabled{opacity:.4;cursor:default}
.colpick{background:none;border:0;padding:2px 4px;cursor:pointer;color:inherit;font:inherit;font-weight:700;border-radius:6px}
.colpick:disabled{cursor:default}
.matrix thead th.is-sel .colpick{background:var(--lake);color:var(--on-lake)}
.matrix thead th.is-sel .colpick small{color:var(--on-lake)}
.weekfocus{font-size:15px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline}
.weekfocus span.it{background:var(--lake-soft);border-radius:999px;padding:2px 10px}

.ritual{border:1px dashed var(--lake);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ritual .row{display:flex;gap:8px;flex-wrap:wrap}

/* the three */
.three{list-style:none;margin:0;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column}
.three li{display:flex;align-items:center;gap:10px;padding:6px 8px}
.three li+li{border-top:1px solid var(--line)}
.three input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;font-size:17px}
.three input::placeholder{color:var(--muted);opacity:.8}
.three li.is-done input{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.check{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;color:transparent;font-size:15px;font-weight:700;display:grid;place-items:center}
.check[aria-pressed="true"]{background:var(--lake);border-color:var(--lake);color:var(--on-lake)}

/* anchors */
.anchors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.anchor{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:76px}
.anchor .a-label{font-weight:700;display:flex;align-items:center;gap:8px}
.anchor .a-hint{font-size:13px;color:var(--muted)}
.anchor .tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 18px}
.anchor[aria-pressed="true"]{background:var(--lake-soft);border-color:var(--lake)}
.anchor[aria-pressed="true"] .tick{background:var(--lake);border-color:var(--lake);box-shadow:inset 0 0 0 3px var(--lake-soft)}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:560px){.pair{grid-template-columns:1fr}}
.pair>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.pair h3{font-size:15px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:44px;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--lake);border-color:var(--lake);color:var(--on-lake);font-weight:700}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.stepper output{min-width:76px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:999px;background:var(--cell);overflow:hidden}
.meter span{display:block;height:100%;background:var(--lake);border-radius:999px}
.meter.over span{background:var(--ember)}

/* fronts */
.front{border-top:1px solid var(--line);padding-top:22px}
.front-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.front-h h2{font-size:24px;line-height:1.2}
.fscore{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sub{display:flex;flex-direction:column;gap:8px}

/* fitbit */
.ftag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--lake-soft);color:var(--lake);vertical-align:1px}
.fitline{font-size:15px;font-variant-numeric:tabular-nums}
.fitstats{display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums}
.fitstats span b{font-weight:700}
.anchor .ftag{margin-top:4px}

/* training */
.train{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.train.done{border-color:var(--lake);background:var(--lake-soft)}
.train-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.train-h b{font-size:17px}
.train details summary{cursor:pointer;color:var(--lake);font-size:15px}
.routine{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.train .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swap{max-width:100%;min-width:0;flex:1 1 180px}
.planpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.pcard.current{border-color:var(--lake)}
.pcard h3{font-family:var(--display);font-size:19px}
.pdays{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:14px}
.pdays b{display:inline-block;width:20px;color:var(--muted)}
.pcard .pill{align-self:flex-start}
table.sched{border-collapse:collapse;width:100%;min-width:340px}
.sched th,.sched td{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.sched th{font-weight:400;white-space:nowrap}
.sched tr.is-today th{color:var(--lake);font-weight:700}
.sched td.st{text-align:right;white-space:nowrap}
.stype{font-weight:700}
.fbal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fbal li{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center}
.fbal .fbar{height:8px;border-radius:999px;background:var(--cell);overflow:hidden}
.fbal .fbar i{display:block;height:100%;background:var(--lake)}
.fbal .fval{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);font-size:14px}
.wkhead .wktitle{flex:1;text-align:center;font-size:clamp(22px,5vw,28px);display:flex;flex-direction:column;align-items:center;gap:2px}
.wkhead .wktitle .hint{font-family:var(--body)}

/* goals */
.goals{gap:16px}
.goal{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.goal.paused{opacity:.75}
.goal-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.goal-h h3{font-family:var(--display);font-size:22px}
.gtag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.goal-now{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.goal-now .big{font-family:var(--display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.gbar{height:10px;border-radius:999px;background:var(--cell);overflow:hidden}
.gbar span{display:block;height:100%;background:var(--lake);border-radius:999px}
.goal-pace{font-size:15px;max-width:62ch}
.goal-actions{display:flex;gap:16px;flex-wrap:wrap}
.linkbtn.danger{color:var(--ember)}
.gspark{width:100%;max-width:560px;height:auto;display:block}
.gspark .ax{fill:var(--muted);font-size:14px;font-family:var(--body)}
.gspark .grid{stroke:var(--line)}
.gspark .ln{fill:none;stroke:var(--lake);stroke-width:2.5;stroke-linejoin:round}
.gspark .pt{fill:var(--lake)}
.gspark .metaline{stroke:var(--ember);stroke-dasharray:5 4;stroke-width:1.5}
.goalform{display:flex;flex-direction:column;gap:10px}
.goalform .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.goalform input,.goalform select{width:100%;min-width:0}
.gactual{width:90px}
.pausedlist summary{cursor:pointer;color:var(--muted)}
.pausedlist[open]{display:flex;flex-direction:column;gap:12px}

/* agenda */
.agenda{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.agenda li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.agenda li:last-child{border-bottom:1px solid var(--line)}
.agenda .ev-t{flex:0 0 104px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.agenda .ev-s{flex:1;min-width:0;overflow-wrap:anywhere}
.agenda .ev-s a{color:inherit;text-decoration:none}
.agenda .ev-s a:hover{text-decoration:underline;text-underline-offset:3px}
.agenda .ev-s small{display:block;color:var(--muted);font-size:13px}
.agenda li.past .ev-s{color:var(--muted)}
.agenda .now{margin-left:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:var(--lake);color:var(--on-lake);border-radius:999px;padding:2px 7px;vertical-align:1px}
.calmsg{display:flex;flex-direction:column;gap:8px;align-items:flex-start}

/* rhythms */
.rhythms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rhythm{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.rhythm .r-label{min-width:0}
.rhythm .r-area{display:block;font-size:12px;color:var(--muted)}
.rhythm[aria-pressed="true"]{border-color:var(--lake);background:var(--lake-soft)}
.rhythm.met:not([aria-pressed="true"]) .r-label{color:var(--muted)}
.dots{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}
.dot.on{background:var(--lake);border-color:var(--lake)}
.extra{font-size:12px;color:var(--lake);font-weight:700}

/* ocio by type */
.ocio-log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ocio-log li{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.ocio-log li:last-child{border-bottom:1px solid var(--line)}
.otag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--lake-soft);color:var(--lake)}
.ocio-log .dur{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ocio-log .que{flex:1;min-width:0;color:var(--muted);overflow-wrap:anywhere}
.ocio-log .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.ocio-form{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.ocio-form .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dur-in{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.dur-in input{width:64px}
#oq{flex:1 1 180px;min-width:0}
.ocio-form .btn{align-self:flex-start}
.sleepbox{display:flex;flex-direction:column;gap:8px}
.sleepbox h3{font-size:15px;font-weight:700}

/* todo */
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.todo li:last-child{border-bottom:1px solid var(--line)}
.todo .t{flex:1;min-width:0;overflow-wrap:anywhere}
.todo li.is-done .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.todo .check{width:26px;height:26px;flex:0 0 26px;font-size:13px}
.todo .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}

/* settings: weekday chips */
.dchips{display:flex;gap:4px;flex-wrap:wrap}
.dchip{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:700;padding:0}
.dchip[aria-pressed="true"]{background:var(--lake);border-color:var(--lake);color:var(--on-lake)}

/* upcoming dates */
.dates{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dates li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dates li:last-child{border-bottom:1px solid var(--line)}
.dates .when{width:56px;flex:0 0 56px;font-variant-numeric:tabular-nums}
.dates .when b{display:block;font-weight:700;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.dates .when small{color:var(--muted);font-size:12px}
.dates .what{flex:1;min-width:0}
.dates .what small{display:block;color:var(--muted);font-size:13px}
.kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:999px;margin-right:6px}
.kind.pago{background:var(--ember-soft);color:var(--ember)}
.kind.cobro{background:var(--lake-soft);color:var(--lake)}
.kind.tarea{background:var(--cell);color:var(--ink)}
.late{color:var(--ember);font-weight:700}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--lake);border-color:var(--lake);color:var(--on-lake)}
.pill.danger{color:var(--ember);border-color:var(--ember)}
.pill.solid{background:var(--lake);border-color:var(--lake);color:var(--on-lake)}

/* done list */
.donelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.donelist li{display:flex;gap:10px;align-items:baseline;padding:4px 0}
.donelist li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ember);flex:0 0 8px;transform:translateY(-1px)}
.donelist li.auto{color:var(--muted)}
.donelist li.auto::before{background:var(--lake)}
.donelist .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.empty{color:var(--muted);font-size:15px}
form.add{display:flex;gap:8px}
form.add input{flex:1;min-width:0}
.field,form.add input,textarea,select,input[type="date"],input[type="number"],input[type="text"]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px}
textarea{width:100%;resize:vertical;min-height:64px}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--lake);background:var(--lake);color:var(--on-lake);cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--lake)}
fieldset:disabled button,fieldset:disabled input,fieldset:disabled textarea{cursor:default;opacity:.6}
.stack{display:flex;flex-direction:column;gap:6px}
.stack label{font-size:14px;font-weight:700}

/* week */
.weeknav{display:flex;align-items:center;gap:10px}
.weeknav h1{font-size:clamp(22px,5vw,28px);flex:1;min-width:0;line-height:1.15}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}

<script>
(() => {
'use strict';

/* ---------- content ---------- */
const PRINCIPLES = [
  'Nunca vas a terminarlo todo. Elegir qué dejar fuera también es planear.',
  'Lo que no hiciste hoy no es una deuda. Mañana empieza en limpio.',
  'Tres cosas bien elegidas pesan más que veinte a medias.',
  'Tu atención es tu vida: donde la pones, ahí estás.',
  'Lo pequeño y constante gana. Paciencia antes que intensidad.',
  'El descanso no necesita justificarse.',
  'Este rato con Emilia no es una pausa entre tareas. Es la vida misma.',
  'Decide de antemano en qué vas a quedarte corto esta semana.',
  'Cierra el día con lo que sí hiciste, no con lo que faltó.',
  'La vida no empieza cuando tengas tiempo. Ya es esta semana.',
  'Hacer una cosa a la vez es más rápido de lo que parece.',
  'No hace falta optimizar el ocio. Basta con elegirlo.'
];
// Fronts of life. Every anchor and rhythm belongs to one (stored in its `area` field).
const FRENTES = {salud:'Salud', social:'Social', finanzas:'Finanzas', desarrollo:'Desarrollo', hogar:'Hogar'};
const FRENTE_DESC = {
  salud:'Cuerpo y mente: dormir, comer, moverte, meditar y descansar.',
  social:'Emilia, tu familia y tus amigos, cerca y lejos.',
  finanzas:'El trabajo que sostiene la casa y el orden del dinero.',
  desarrollo:'Leer, aprender y crear lo tuyo.',
  hogar:'La base que hace posible lo demás: la casa, la compra y la logística.'
};
// Areas used before fronts existed, mapped to their front.
const AREA_TO_FRONT = {mente:'salud', cuerpo:'salud', naturaleza:'salud', ocio:'salud', familia:'social', amigos:'social',
  trabajo:'finanzas', crecimiento:'desarrollo', creatividad:'desarrollo', hogar:'hogar'};
const DEFAULT_CFG = {
  v:5, birth:'', emiliaBirth:'', sleepTarget:7, ocioBudgetH:10,
  anchors:[
    {id:'meditar', label:'Meditar', hint:'Aunque sean 5 minutos', area:'salud', active:true},
    {id:'mover',   label:'Moverme', hint:'Ejercicio, caminar, estirar', area:'salud', active:true},
    {id:'comer',   label:'Comer bien', hint:'Comida de verdad, sin prisa', area:'salud', active:true},
    {id:'leer',    label:'Leer con foco', hint:'Un bloque sin pantalla', area:'desarrollo', active:true},
    {id:'emilia',  label:'Jugar con Emilia', hint:'Presente, sin teléfono', area:'social', active:true}
  ],
  rhythms:[
    {id:'trabajo',   label:'Bloque de trabajo profundo', area:'finanzas', target:5, active:true},
    {id:'finanzas',  label:'Revisar finanzas personales', area:'finanzas', target:1, active:true},
    {id:'papas',     label:'Llamar a mis papás y mandar fotos de Emilia', area:'social', target:2, active:true},
    {id:'lejos',     label:'Escribir a un amigo que está lejos', area:'social', target:2, active:true},
    {id:'cerca',     label:'Compartir con amigos cerca', area:'social', target:1, active:true},
    {id:'naturaleza',label:'Salir a la naturaleza', area:'salud', target:1, active:true},
    {id:'creativo',  label:'Proyecto creativo', area:'desarrollo', target:2, active:true},
    {id:'perfil',    label:'Actualizar CV y LinkedIn', area:'finanzas', target:1, active:true},
    {id:'aprender',  label:'Aprender: cursos de IA', area:'desarrollo', target:2, active:true},
    {id:'apps',      label:'Construir mis apps de Claude', area:'desarrollo', target:2, active:true},
    {id:'compra',    label:'Hacer la compra', area:'hogar', target:1, active:true}
  ],
  // Household chores on fixed weekdays (0 = lunes … 6 = domingo).
  chores:[
    {id:'aspirar', label:'Aspirar', days:[0,3], active:true},
    {id:'trapear', label:'Trapear', days:[0,3], active:true},
    {id:'wc',      label:'Limpiar el WC', days:[0,3], active:true}
  ],
  // Options offered when logging leisure; editable in Ajustes.
  ocioTypes:[
    {id:'pelicula', label:'Película'},
    {id:'serie', label:'Serie'},
    {id:'videojuego', label:'Videojuego'},
    {id:'otro', label:'Otro'}
  ],
  keyDates:[],
  // Weekly training plan: plan id from PLANES and one session id per weekday (Monday first).
  training:{plan:'', dias:null},
  // Goals (at most MAX_GOALS active). The weight goal starts as a draft until a target is set.
  goals:[{id:'peso', tipo:'peso', nombre:'Peso', frente:'salud', activo:true, meta:null, fecha:'', inicio:null, inicio_fecha:'', creado:''}]
};

const THREE_PH = ['Lo que haría que hoy valga la pena','Algo de trabajo que mueve la aguja','Algo para ti o para tu familia'];
const SLEEP_OPTS = [[5,'≤5'],[6,'6'],[6.5,'6½'],[7,'7'],[7.5,'7½'],[8,'8'],[9,'9+']];
const DOW = ['L','M','X','J','V','S','D'];
const DOW_LONG = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d||1); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const todayISO = () => iso(new Date());
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return iso(d); };
const weekDays = m => Array.from({length:7}, (_,i) => addDays(m,i));
const monthKey = s => s.slice(0,7);
const daysInMonth = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const shiftMonth = (ym,n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const diffDays = (a,b) => Math.round((parse(b) - parse(a)) / 86400000);
const dow = s => (parse(s).getDay()+6)%7;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLong = s => cap(new Intl.DateTimeFormat('es',{weekday:'long',day:'numeric',month:'long'}).format(parse(s)));
const fmtDM = s => new Intl.DateTimeFormat('es',{day:'numeric',month:'short'}).format(parse(s)).replace('.','');
const fmtMonth = ym => cap(new Intl.DateTimeFormat('es',{month:'long',year:'numeric'}).format(parse(ym+'-01')));
const fmtNum = (n,d=0) => n.toLocaleString('es',{maximumFractionDigits:d,minimumFractionDigits:0});
const fmtMin = m => { if (!m) return '0 min'; const h = Math.floor(m/60), r = m%60; return h ? `${h} h${r ? ' '+r : ''}` : `${r} min`; };
const fmtSleep = v => v === 9 ? '9+' : v === 5 ? '≤5' : Number.isInteger(v * 2) ? String(v).replace('.5','½') : fmtNum(v, 1);
const pct = v => `${Math.round(v*100)} %`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid36 = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const avg = a => a.reduce((s,v)=>s+v,0) / a.length;

let TODAY, MIN_MONDAY, MAX_MONDAY, MIN_MONTH, MAX_MONTH;
function setToday(){
  TODAY = todayISO();
  MIN_MONDAY = addDays(mondayOf(TODAY), -7*26);
  MAX_MONDAY = addDays(mondayOf(TODAY), 7);
  MIN_MONTH = shiftMonth(monthKey(TODAY), -9);
  MAX_MONTH = shiftMonth(monthKey(TODAY), 3);
}
setToday();
const stable = v => Array.isArray(v) ? '[' + v.map(stable).join(',') + ']'
  : v && typeof v === 'object' ? '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}'
  : JSON.stringify(v === undefined ? null : v);

/* ---------- state ---------- */
const S = {
  cfg: normCfg(null), weeks:{}, months:{},
  view:'hoy', day:TODAY, month:monthKey(TODAY), editPlan:false, showReview:false,
  ready:false, mode:'connecting', confirm:null,
  cal:{status:'idle'}, todo:{items:[]},
  ocioPick:null, ocioDraft:{h:'', m:'', q:''},
  fit:{status:'idle'}, peso:{status:'idle'},
  pickPlan:false, goalNew:false, goalTipo:'numero', goalEdit:null
};

function normCfg(c){
  const d = structuredClone(DEFAULT_CFG);
  if (!c) return d;
  const o = Object.assign(d, structuredClone(c));
  if (!Array.isArray(o.anchors)) o.anchors = structuredClone(DEFAULT_CFG.anchors);
  if (!Array.isArray(o.rhythms)) o.rhythms = structuredClone(DEFAULT_CFG.rhythms);
  if (!Array.isArray(o.keyDates)) o.keyDates = [];
  if (typeof o.sleepTarget !== 'number') o.sleepTarget = 7;
  if (typeof o.ocioBudgetH !== 'number') o.ocioBudgetH = 10;
  if (!(c.v >= 2)){
    // v2: fixed-day chores replace the generic "Limpiar la casa" rhythm; weekly leisure limit is 10 h.
    o.rhythms = o.rhythms.filter(r => r.id !== 'limpiar');
    if (o.ocioBudgetH === 6) o.ocioBudgetH = 10;
    o.v = 2;
  }
  if (!(c.v >= 3)){
    // v3: "Mirar la agenda" is no longer a daily anchor; the calendar is shown in the day view instead.
    o.anchors = o.anchors.filter(a => a.id !== 'agenda');
    o.v = 3;
  }
  if (!(c.v >= 4)){
    // v4: habits are grouped in fronts. Reading moves to Desarrollo; the profile rhythm splits into CV/LinkedIn and learning.
    const leer = o.anchors.find(a => a.id === 'leer'); if (leer) leer.area = 'desarrollo';
    const perfil = o.rhythms.find(r => r.id === 'perfil');
    if (perfil && /CV/.test(perfil.label) && /IA/.test(perfil.label)){ perfil.label = 'Actualizar CV y LinkedIn'; perfil.target = 1; perfil.area = 'finanzas'; }
    if (!o.rhythms.some(r => r.id === 'aprender')){
      const i = o.rhythms.findIndex(r => r.id === 'perfil');
      o.rhythms.splice(i >= 0 ? i + 1 : o.rhythms.length, 0, structuredClone(DEFAULT_CFG.rhythms.find(r => r.id === 'aprender')));
    }
    o.v = 4;
  }
  for (const it of [...o.anchors, ...o.rhythms]) if (!FRENTES[it.area]) it.area = AREA_TO_FRONT[it.area] || 'desarrollo';
  if (!Array.isArray(o.chores)) o.chores = structuredClone(DEFAULT_CFG.chores);
  if (!o.training || typeof o.training !== 'object') o.training = {plan:'', dias:null};
  if (o.training.plan && (!Array.isArray(o.training.dias) || o.training.dias.length !== 7)) o.training.dias = PLANES[o.training.plan] ? PLANES[o.training.plan].dias.slice() : null;
  if (!Array.isArray(o.goals)) o.goals = structuredClone(DEFAULT_CFG.goals);
  o.goals = o.goals.filter(g => g && g.id && ['peso', 'numero', 'hito'].includes(g.tipo));
  if (!Array.isArray(o.ocioTypes) || !o.ocioTypes.length) o.ocioTypes = structuredClone(DEFAULT_CFG.ocioTypes);
  return o;
}
function newDay(){ return {a:{}, three:[{t:'',d:false},{t:'',d:false},{t:'',d:false}], done:[], note:'', ocioLog:[]}; }
const ocioSum = x => x.ocioLog.reduce((s, e) => s + (e.min || 0), 0);
function normWeek(w){
  w = structuredClone(w || {});
  w.days = w.days && typeof w.days === 'object' ? w.days : {};
  for (const k in w.days){
    const src = w.days[k] || {};
    const x = Object.assign(newDay(), src);
    if (!Array.isArray(src.ocioLog)){
      // Older days used fixed 30-minute counters; turn them into log entries.
      const t = src.ocioT || {}, log = [];
      if (t.serie) log.push({id:'m1', t:'serie', tl:'Película o serie', min:t.serie, q:''});
      if (t.juego) log.push({id:'m2', t:'videojuego', tl:'Videojuego', min:t.juego, q:''});
      const rest = Math.max(0, (src.ocio || 0) - (t.serie || 0) - (t.juego || 0));
      if (rest) log.push({id:'m3', t:'otro', tl:'Otro', min:rest, q:''});
      if (log.length && src.ocioQue) log[0].q = src.ocioQue;
      x.ocioLog = log;
    }
    delete x.ocioT; delete x.ocioQue;
    x.ocioLog = x.ocioLog.filter(e => e && e.min > 0);
    if (x.ocioLog.length) x.ocio = ocioSum(x);
    if (!Array.isArray(x.three)) x.three = newDay().three;
    while (x.three.length < 3) x.three.push({t:'',d:false});
    if (!Array.isArray(x.done)) x.done = [];
    if (!x.a || typeof x.a !== 'object') x.a = {};
    w.days[k] = x;
  }
  w.rhythms = w.rhythms && typeof w.rhythms === 'object' ? w.rhythms : {};
  w.chores = w.chores && typeof w.chores === 'object' ? w.chores : {};
  w.entreno = w.entreno && typeof w.entreno === 'object' ? w.entreno : {};
  w.plan = Object.assign({focus:['','',''], skip:''}, w.plan || {});
  if (!Array.isArray(w.plan.focus)) w.plan.focus = ['','',''];
  while (w.plan.focus.length < 3) w.plan.focus.push('');
  w.review = Object.assign({emilia:'', worked:'', adjust:''}, w.review || {});
  return w;
}
function normMonth(m){
  m = structuredClone(m || {});
  m.done = m.done && typeof m.done === 'object' ? m.done : {};
  m.review = Object.assign({done:false, note:''}, m.review || {});
  return m;
}
const week = m => S.weeks[m] || (S.weeks[m] = normWeek({start:m}));
const day = d => { const w = week(mondayOf(d)); return w.days[d] || (w.days[d] = newDay()); };
const month = k => S.months[k] || (S.months[k] = normMonth({key:k}));
const activeAnchors = () => S.cfg.anchors.filter(a => a.active);
const activeRhythms = () => S.cfg.rhythms.filter(r => r.active && r.target > 0);
const activeChores = () => S.cfg.chores.filter(c => c.active && Array.isArray(c.days) && c.days.length);
function normTodo(t){
  const items = t && Array.isArray(t.items) ? t.items : [];
  return {items: items.filter(i => i && typeof i.t === 'string' && i.id).map(i => ({id:String(i.id), t:i.t, done:!!i.done, created:i.created || '', doneOn:i.doneOn || ''}))};
}
const ocioLabel = e => { const t = S.cfg.ocioTypes.find(o => o.id === e.t); return t ? t.label : (e.tl || 'Otro'); };

/* ---------- storage (db capability, private per person) ---------- */
let db = null, base = null;
const queue = new Map();      // path -> {timer, get}
const inflight = new Map();   // path -> promise
const isBusy = p => queue.has(p) || inflight.has(p);

function schedule(path, get){
  if (!db) return;
  const q = queue.get(path); if (q) clearTimeout(q.timer);
  queue.set(path, {get, timer:setTimeout(() => flush(path), 700)});
  saveState();
}
async function flush(path, retried){
  if (inflight.has(path)) await inflight.get(path);
  const q = queue.get(path);
  if (!q || inflight.has(path)) return;
  clearTimeout(q.timer); queue.delete(path);
  const data = q.get();
  const p = db.doc(path).set(data).catch(e => writeError(e, path, q, retried));
  inflight.set(path, p); saveState();
  await p; inflight.delete(path); saveState();
}
function flushAll(){ for (const p of [...queue.keys()]) flush(p); }
function writeError(e, path, q, retried){
  const code = e && e.code;
  if (code === 'unavailable' && !retried){
    setTimeout(() => { if (!queue.has(path)) queue.set(path, {get:q.get, timer:0}); flush(path, true); }, 800 + Math.random()*1200);
    return;
  }
  if (code === 'invalid_argument'){ S.mode = 'readonly'; render(); return; }
  if (code === 'quota_exceeded'){ toast('El espacio de guardado está lleno. Borra fechas o hábitos que ya no uses.'); return; }
  if (code === 'revoked' || code === 'not_granted'){ S.mode = 'readonly'; render(); return; }
  toast('No se pudo guardar este cambio. Vuelve a intentarlo en un momento.');
}
// Each getter stamps the local copy too, so the store's echo of our own write compares equal and causes no repaint.
const stamp = (o, extra) => Object.assign(o, extra, {updatedAt:new Date().toISOString()});
const saveWeek = m => schedule(`${base}/w-${m}`, () => structuredClone(stamp(S.weeks[m], {kind:'week', start:m})));
const saveMonth = k => schedule(`${base}/m-${k}`, () => structuredClone(stamp(S.months[k], {kind:'month', key:k})));
const saveCfg = () => schedule(`${base}/config`, () => structuredClone(stamp(S.cfg, {kind:'config'})));
const saveTodo = () => schedule(`${base}/todo`, () => structuredClone(stamp(S.todo, {kind:'todo'})));

function saveState(){
  const el = document.getElementById('savestate');
  if (!el) return;
  el.textContent = (queue.size || inflight.size) ? 'Guardando…' : (S.mode === 'ok' ? 'Guardado' : '');
}

async function connect(){
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function'){ S.mode = 'local'; S.ready = true; render(); return; }
  let dbNs = null, userNs = null;
  try { [dbNs, userNs] = await Promise.all([cl.use('db'), cl.use('user')]); } catch { /* treated as absent */ }
  if (!dbNs || !userNs){ S.mode = 'local'; S.ready = true; render(); return; }
  const id = await userNs.id();
  if (!id){ S.mode = 'signedout'; S.ready = true; render(); return; }
  db = dbNs; base = `data/users/${id}`;
  subscribe();
}

function subscribe(){
  const got = {cfg:false, weeks:false, months:false, todo:false};
  const timer = setTimeout(() => { if (!S.ready){ S.mode = 'slow'; render(); } }, 10000);
  const ready = changed => {
    if (!S.ready && got.cfg && got.weeks && got.months && got.todo){
      S.ready = true; S.mode = 'ok'; clearTimeout(timer); changed = true;
      if (S.fit.status === 'ok') fillFromFit(S.fit.days);
    }
    if (changed) render();
  };
  const fail = e => {
    clearTimeout(timer);
    if (e && (e.code === 'revoked' || e.code === 'not_granted')){ S.mode = 'readonly'; }
    else if (!S.ready){ S.mode = 'error'; }
    else toast('Se perdió la conexión con tu guardado. Recarga la página para volver a conectar.');
    render();
  };
  db.doc(`${base}/config`).onSnapshot(snap => {
    let changed = false;
    if (!isBusy(`${base}/config`)){
      const next = normCfg(snap.exists ? snap.data() : null);
      if (stable(next) !== stable(S.cfg)){ S.cfg = next; changed = true; }
    }
    got.cfg = true; ready(changed);
  }, fail);
  db.doc(`${base}/todo`).onSnapshot(snap => {
    let changed = false;
    if (!isBusy(`${base}/todo`)){
      const next = normTodo(snap.exists ? snap.data() : null);
      if (stable(next) !== stable(normTodo(S.todo))){ S.todo = next; changed = true; }
    }
    got.todo = true; ready(changed);
  }, fail);
  const col = db.collection(base);
  col.where('kind','==','week').orderBy('start','desc').limit(30).onSnapshot(snap => {
    let changed = false;
    for (const d of snap.docs){
      const data = d.data(); if (!data || !data.start) continue;
      if (isBusy(`${base}/${d.id}`)) continue;
      const next = normWeek(data);
      if (!S.weeks[data.start] || stable(next) !== stable(S.weeks[data.start])){ S.weeks[data.start] = next; changed = true; }
    }
    got.weeks = true; ready(changed);
  }, fail);
  col.where('kind','==','month').orderBy('key','desc').limit(14).onSnapshot(snap => {
    let changed = false;
    for (const d of snap.docs){
      const data = d.data(); if (!data || !data.key) continue;
      if (isBusy(`${base}/${d.id}`)) continue;
      const next = normMonth(data);
      if (!S.months[data.key] || stable(next) !== stable(S.months[data.key])){ S.months[data.key] = next; changed = true; }
    }
    got.months = true; ready(changed);
  }, fail);
}

const canEdit = () => S.ready && S.mode !== 'readonly';

/* ---------- Google Calendar (mcp capability, read-only) ---------- */
const CAL = 'Google Calendar';
let mcp = null, perms = null, calUnsub = null, calKey = null, calRetried = false;
const calInput = d => ({startTime:`${d}T00:00:00`, endTime:`${addDays(d,1)}T00:00:00`, orderBy:'startTime', pageSize:50});
const CAL_RETRACT = ['needs_reauth','server_not_connected','server_not_found','selection_required','not_in_manifest',
  'blocked_by_policy','approval_required','not_granted','capability_disabled','capability_removed','consent_required','user_changed'];

async function connectCal(){
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function'){ S.cal = {status:'off'}; render(); return; }
  const [m, p] = await Promise.all([cl.use('mcp').catch(() => null), cl.use('permissions').catch(() => null)]);
  if (!m){ S.cal = {status:'off'}; render(); return; }
  mcp = m; perms = p;
  ensureFitWatch(); ensurePesoWatch();
  const st = p ? await p.state('mcp:' + CAL).catch(() => 'unavailable') : 'prompt';
  if (st === 'denied'){ S.cal = {status:'denied'}; render(); return; }
  ensureCalWatch(); render();
}
function ensureCalWatch(){
  if (!mcp) return;
  const d = S.day;
  if (calKey === d) return;
  if (calUnsub){ calUnsub(); calUnsub = null; }
  calKey = d; calRetried = false;
  S.cal = {status:'loading'};
  calUnsub = mcp.watchTool(CAL, 'list_events', calInput(d), ev => {
    if (calKey !== d) return;
    if (ev.type === 'data') applyCal(ev.result); else calError(ev.error, d);
  }, {cache:{staleTime:60000, gcTime:1800000}, refetchInterval:300000});
}
function applyCal(res){
  const p = res && res.payload;
  const list = p && typeof p === 'object' && Array.isArray(p.events) ? p.events : [];
  const events = list.filter(e => e && e.status !== 'cancelled').map(e => ({
    summary: typeof e.summary === 'string' ? e.summary : '',
    start: e.start || {}, end: e.end || {},
    location: typeof e.location === 'string' ? e.location : '',
    link: typeof e.htmlLink === 'string' && e.htmlLink.startsWith('https://') ? e.htmlLink : ''
  }));
  const at = res && res.cache && res.cache.storedAt ? res.cache.storedAt : Date.now();
  const same = S.cal.status === 'ok' && !S.cal.stale && stable(events) === stable(S.cal.events);
  S.cal = {status:'ok', events, at};
  if (S.view !== 'hoy') return;
  if (same){ const el = document.getElementById('cal-at'); if (el) el.textContent = calStamp(); }
  else render();
}
function calError(e, d){
  const code = (e && e.code) || 'upstream_error';
  if (CAL_RETRACT.includes(code) || S.cal.status !== 'ok') S.cal = {status:'error', code};
  else S.cal.stale = true;
  if (e && e.retryable && !calRetried){
    calRetried = true;
    setTimeout(() => calOnce(d), Math.min(60000, e.retryAfterMs || 1500 + Math.random()*2500));
  }
  if (S.view === 'hoy') render();
}
function calOnce(d){
  if (!mcp || calKey !== d) return;
  mcp.callTool(CAL, 'list_events', calInput(d)).then(
    r => { if (calKey === d) applyCal(r); },
    e => { if (calKey === d){ calRetried = true; calError(e, d); } });
}
/* ---------- Fitbit (mcp capability, read-only "Fit Bit" connector) ---------- */
const FIT = 'Fit Bit';
let fitUnsub = null, fitKey = null;
const FIT_MSG = {
  needs_reauth:'La conexión con tu Fitbit caducó. Vuelve a conectar Fit Bit en claude.ai, en Configuración → Conectores.',
  server_not_connected:'Conecta Fit Bit en claude.ai, en Configuración → Conectores, para llenar sueño y movimiento solos.',
  server_not_found:'Conecta Fit Bit en claude.ai, en Configuración → Conectores, para llenar sueño y movimiento solos.',
  selection_required:'Tienes más de un conector llamado Fit Bit. Elige cuál usar en el aviso de claude.ai.',
  not_in_manifest:'Esta página no tiene permiso para leer tu Fitbit.',
  consent_required:'Esta página no tiene permiso para leer tu Fitbit.',
  blocked_by_policy:'Tu organización no permite usar este conector aquí.',
  tool_error:'Tu Fitbit no respondió esta vez.'
};
/** Watch the selected week (up to today) from the Fitbit connector. */
function ensureFitWatch(){
  if (!mcp) return;
  const m = mondayOf(S.day), end = addDays(m, 6) < TODAY ? addDays(m, 6) : TODAY, key = m + ':' + end;
  if (fitKey === key) return;
  if (fitUnsub){ fitUnsub(); fitUnsub = null; }
  fitKey = key;
  if (S.fit.status !== 'ok') S.fit = {status:'loading', days:{}};
  fitUnsub = mcp.watchTool(FIT, 'resumen_de_dias', {desde:m, hasta:end}, ev => {
    if (fitKey !== key) return;
    if (ev.type === 'data') applyFit(ev.result);
    else {
      const code = (ev.error && ev.error.code) || 'upstream_error';
      if (S.fit.status !== 'ok' || CAL_RETRACT.includes(code)) S.fit = {status:'error', code, days:{}};
      if (S.view === 'hoy') render();
    }
  }, {cache:{staleTime:300000, gcTime:3600000}, refetchInterval:900000});
}
function ensureWatches(){ ensureCalWatch(); ensureFitWatch(); }
function applyFit(res){
  const p = res && res.payload, dias = p && Array.isArray(p.dias) ? p.dias : [], days = {};
  for (const f of dias) if (f && typeof f.fecha === 'string') days[f.fecha] = f;
  S.fit = {status:'ok', days, at: res && res.cache && res.cache.storedAt ? res.cache.storedAt : Date.now()};
  const wrote = S.ready && canEdit() ? fillFromFit(days) : false;
  if (S.view === 'hoy' || wrote) render();
}
/** Copy Fitbit data into the days it covers. Manual entries always win; writes only what changed. */
function fillFromFit(days){
  const touched = new Set(), mover = S.cfg.anchors.find(a => a.id === 'mover' && a.active);
  for (const [d, f] of Object.entries(days)){
    if (d > TODAY || d < MIN_MONDAY) continue;
    const x = day(d), m = mondayOf(d);
    const sue = f.sueno && typeof f.sueno.minutosDormido === 'number' ? f.sueno : null;
    if (sue && x.sleepSrc !== 'manual'){
      const v = Math.round(sue.minutosDormido / 6) / 10;
      if (x.sleep !== v || x.sleepSrc !== 'fitbit'){ x.sleep = v; x.sleepSrc = 'fitbit'; touched.add(m); }
    }
    const ex = Array.isArray(f.ejercicios) ? f.ejercicios : [];
    const exMin = ex.reduce((t, e) => t + (e.minutos || 0), 0), azm = f.minutosZonaActiva || 0;
    const aSrc = x.aSrc || {};
    if (mover && (exMin >= 10 || azm >= 20) && !x.a.mover && aSrc.mover !== 'manual'){
      x.a.mover = true; x.aSrc = Object.assign({}, aSrc, {mover:'fitbit'}); touched.add(m);
    }
    if (hasPlan() && exMin >= 15){
      const w = week(m), e = w.entreno[d] || {};
      if (SESIONES[planDay(d)].tipo !== 'descanso' && !e.done && e.src !== 'manual'){ w.entreno[d] = Object.assign({}, e, {done:true, src:'fitbit'}); touched.add(m); }
    }
    const fit = {
      pasos: typeof f.pasos === 'number' ? f.pasos : null,
      azm: typeof f.minutosZonaActiva === 'number' ? f.minutosZonaActiva : null,
      ej: ex.map(e => ({n: String(e.nombre || e.tipo || 'Ejercicio'), m: e.minutos || 0, i: String(e.inicio || '')})),
      rhr: typeof f.pulsoReposo === 'number' ? f.pulsoReposo : null,
      sue: sue ? {min: sue.minutosDormido, a: String(sue.acostado || ''), d: String(sue.despierto || '')} : null
    };
    if (stable(fit) !== stable(x.fit || null)){ x.fit = fit; touched.add(m); }
  }
  for (const m of touched) saveWeek(m);
  return touched.size > 0;
}
const fmtHM = min => { const h = Math.floor(min / 60), r = min % 60; return h ? `${h} h${r ? ' ' + pad(r) : ''}` : `${r} min`; };
function fitBlock(x){
  const f = x.fit, st = S.fit;
  let status = '';
  if (st.status === 'error'){
    const msg = FIT_MSG[st.code] || 'No pude leer tu Fitbit ahora.';
    const btn = (st.code === 'not_in_manifest' || st.code === 'consent_required') && perms ? ' <button class="linkbtn" data-act="fit-perms">Permitir</button>'
      : !['needs_reauth','server_not_connected','server_not_found','blocked_by_policy','selection_required'].includes(st.code) ? ' <button class="linkbtn" data-act="fit-retry">Reintentar</button>' : '';
    status = `<p class="hint">${msg}${btn}</p>`;
  } else if (st.status === 'loading' && !f) status = '<p class="hint">Leyendo tu Fitbit…</p>';
  else if (st.status === 'ok') status = `<p class="meta">Fitbit actualizado a las ${hm(new Date(st.at))}</p>`;
  if (!f && st.status === 'off') return '';
  if (!f && !status) return '';
  const parts = [];
  if (f){
    if (f.pasos !== null) parts.push(`<span><b>${fmtNum(f.pasos)}</b> pasos</span>`);
    if (f.azm !== null) parts.push(`<span><b>${f.azm}</b> min en zona activa</span>`);
    for (const e of f.ej) parts.push(`<span><b>${esc(e.n)}</b> ${fmtMin(e.m)}${e.i ? ' a las ' + esc(e.i) : ''}</span>`);
    if (f.rhr !== null) parts.push(`<span>pulso en reposo <b>${f.rhr}</b></span>`);
  }
  return `<div class="sub"><p class="label">Actividad <span class="ftag">Fitbit</span></p>
    ${parts.length ? `<div class="fitstats">${parts.join('')}</div>` : (f ? '<p class="hint">Sin actividad registrada ese día.</p>' : '')}
    ${status}</div>`;
}

};
const hasPlan = () => !!(S.cfg.training && S.cfg.training.plan && Array.isArray(S.cfg.training.dias));
/** The session planned for day d (a swap chosen that day wins over the plan). */
function planDay(d){
  if (!hasPlan()) return null;
  const w = week(mondayOf(d)), e = w.entreno[d];
  const id = (e && e.cambio) || S.cfg.training.dias[dow(d)];
  return SESIONES[id] ? id : 'descanso';
}
function trainingBlock(d){
  if (!hasPlan()) return `<div class="sub" id="entreno-hoy"><p class="label">Entrenamiento</p>
    <p class="hint">Aún no eliges un plan de pesas, cardio y yoga. <a href="#semana">Elige uno en Semana</a>.</p></div>`;
  const w = week(mondayOf(d)), e = w.entreno[d] || {}, id = planDay(d), s = SESIONES[id], def = S.cfg.training.dias[dow(d)];
  const opts = Object.entries(SESIONES).map(([k, v]) => `<option value="${k}" ${k === id ? 'selected' : ''}>${esc(v.nombre)}${k === def ? ' (la del plan)' : ''}</option>`).join('');
  return `<div class="sub" id="entreno-hoy"><p class="label">Entrenamiento ${d === TODAY ? 'de hoy' : 'de ese día'}</p>

      <div class="train-h"><b>${esc(s.nombre)}</b>${s.min ? `<span class="meta">~${s.min} min</span>` : ''}${e.done && e.src === 'fitbit' ? '<span class="ftag">Registrado por tu Fitbit</span>' : ''}</div>
      ${s.tipo === 'descanso' ? `<p class="hint">${esc(s.items[0])}</p>` : `<details><summary>Ver la rutina</summary><ul class="routine">${s.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></details>`}
      <div class="row">
        ${s.tipo === 'descanso' ? '' : `<button class="pill ${e.done ? '' : 'solid'}" data-act="train-done" data-day="${d}" aria-pressed="${!!e.done}">${e.done ? 'Hecho ✓' : 'Marcar hecho'}</button>`}
        <label class="sr" for="train-swap">Cambiar la sesión</label>
        <select id="train-swap" class="swap" data-bind="train-swap" data-day="${d}">${opts}</select>

/* ---------- goals ---------- */
const MAX_GOALS = 3;
let pesoUnsub = null, pesoKey = null;
/** Weight history (up to 400 days) from the Fit Bit connector, refreshed hourly. */
function ensurePesoWatch(){
  if (!mcp) return;
  const key = TODAY;
  if (pesoKey === key) return;
  if (pesoUnsub){ pesoUnsub(); pesoUnsub = null; }
  pesoKey = key;
  if (S.peso.status !== 'ok') S.peso = {status:'loading'};
  pesoUnsub = mcp.watchTool(FIT, 'pesos', {desde: addDays(TODAY, -399), hasta: TODAY}, ev => {
    if (pesoKey !== key) return;
    if (ev.type === 'data'){
      const p = ev.result && ev.result.payload, rows = p && Array.isArray(p.rows) ? p.rows : [];
      S.peso = {status:'ok', at: ev.result.cache && ev.result.cache.storedAt ? ev.result.cache.storedAt : Date.now(),
        rows: rows.filter(r => r && typeof r.fecha === 'string').sort((a, b) => a.fecha < b.fecha ? -1 : 1)};
      fillGoalStarts();
    } else {
      const code = (ev.error && ev.error.code) || 'upstream_error';
      if (S.peso.status !== 'ok' || CAL_RETRACT.includes(code)) S.peso = {status:'error', code};
    }
    if (S.view === 'objetivos') render();
  }, {cache:{staleTime:600000, gcTime:86400000}, refetchInterval:3600000});
}
/** Weight progress for a weight goal: latest, start, pace over the last 4 weeks and projected date. */
function pesoStats(g){
  const rows = (S.peso.rows || []).filter(r => typeof r.peso_kg === 'number');
  if (!rows.length) return null;
  const last = rows[rows.length - 1];
  let inicio = g.inicio, inicioF = g.inicio_fecha;
  if (typeof inicio !== 'number'){ const s = rows.find(r => r.fecha >= (g.creado || TODAY)) || last; inicio = s.peso_kg; inicioF = s.fecha; }
  const win = rows.filter(r => r.fecha >= addDays(last.fecha, -28));
  let pace = null;
  if (win.length >= 2 && diffDays(win[0].fecha, last.fecha) >= 7){

/* ---------- scoring ---------- */
function scoreWeek(m){
  const w = S.weeks[m]; if (!w) return null;
  const days = weekDays(m).filter(d => d <= TODAY);
  if (!days.length) return null;
  const per = {}; let any = false;
  const add = (a,v) => (per[a] || (per[a] = [])).push(v);
  for (const a of activeAnchors()){
    const c = days.filter(d => w.days[d] && w.days[d].a[a.id]).length;
    add(a.area, c / days.length); if (c) any = true;
  }
  for (const r of activeRhythms()){
    const c = (w.rhythms[r.id] || []).length;
    add(r.area, Math.min(1, c / r.target)); if (c) any = true;
  }
  for (const c of activeChores()){
    const sched = days.filter(d => c.days.includes(dow(d))).length;
    if (!sched) continue;
    const done = (w.chores[c.id] || []).length;
    add('hogar', Math.min(1, done / sched)); if (done) any = true;
  }
  if (hasPlan()){
    const planned = days.filter(d => SESIONES[planDay(d)].tipo !== 'descanso');
    const done = planned.filter(d => w.entreno[d] && w.entreno[d].done).length;
    if (planned.length){ add('salud', done / planned.length); if (done) any = true; }
  }
  const sl = days.map(d => w.days[d] && w.days[d].sleep).filter(v => typeof v === 'number');
  if (sl.length){ add('salud', sl.filter(v => v >= S.cfg.sleepTarget).length / sl.length); any = true; }
  const oc = days.map(d => w.days[d] && w.days[d].ocio).filter(v => typeof v === 'number');
  const ocio = oc.reduce((s,v) => s+v, 0);
  if (oc.length){ const b = S.cfg.ocioBudgetH * 60; add('salud', ocio <= b ? 1 : b / ocio); any = true; }
  if (!any) return null;
  const areas = {}; for (const k in per) areas[k] = avg(per[k]);
  return {overall: avg(Object.values(areas)), areas, sleepAvg: sl.length ? avg(sl) : null, ocio: oc.length ? ocio : null,
          complete: addDays(m,6) < TODAY};
}

    for (const e of x.ocioLog){ const l = ocioLabel(e); out.set(l, (out.get(l) || 0) + e.min); }

function choresFor(d){
  const m = mondayOf(d), w = week(m), upTo = weekDays(m).filter(x => x <= d);
  return activeChores().map(c => {
    const done = w.chores[c.id] || [], doneToday = done.includes(d), today = c.days.includes(dow(d));
    const sched = upTo.filter(x => c.days.includes(dow(x)));
    const owed = sched.length - done.length;

    let note = '';

function upcoming(from){

  const days = weekDays(m), sl = weekSleep(m), oc = weekOcio(m), budget = S.cfg.ocioBudgetH * 60;
  const row = (label, cells, tot, met) => `<tr><th scope="row">${label}</th>${cells}<td class="tot ${met ? 'met' : ''}">${tot}</td></tr>`;
  const cell = (act, id, d, on, label, extra = '') => `<td><button class="cell ${extra}" data-act="${act}" data-id="${id}" data-day="${d}" aria-pressed="${on}" aria-label="${label}, ${DOW_LONG[dow(d)]}" ${d > TODAY ? 'disabled' : ''}></button></td>`;
  const anchorRow = a => {
    const c = days.filter(d => w.days[d] && w.days[d].a[a.id]).length;
    return row(esc(a.label), days.map(d => cell('cell', a.id, d, !!(w.days[d] && w.days[d].a[a.id]), esc(a.label))).join(''), `${c}/7`, c >= 5);
  };
  const rhythmRow = r => {
    const arr = w.rhythms[r.id] || [];
    return row(esc(r.label), days.map(d => cell('rhythm', r.id, d, arr.includes(d), esc(r.label))).join(''), `${arr.length}/${r.target}`, arr.length >= r.target);
  };
  const choreRow = c => {
    const arr = w.chores[c.id] || [], sched = days.filter(d => c.days.includes(dow(d))).length;
    return row(esc(c.label), days.map(d => cell('chore', c.id, d, arr.includes(d), esc(c.label) + (c.days.includes(dow(d)) ? ' (toca)' : ''), c.days.includes(dow(d)) ? 'sched' : '')).join(''), `${arr.length}/${sched}`, arr.length >= sched);
  };
  const sleepRow = row('Sueño (h)', days.map(d => `<td class="val">${w.days[d] && typeof w.days[d].sleep === 'number' ? fmtSleep(w.days[d].sleep) : '·'}</td>`).join(''), sl.length ? fmtNum(avg(sl),1) : '–', sl.length && avg(sl) >= S.cfg.sleepTarget);
  const ocioRow = row('Ocio (min)', days.map(d => { const x = w.days[d]; if (!x || !x.ocio) return '<td class="val">·</td>';
    return `<td class="val" title="${esc(x.ocioLog.map(ocioEntryText).join(' · '))}">${x.ocio}</td>`; }).join(''), fmtMin(oc), oc && oc <= budget);
  const trainRow = hasPlan() ? row('Entrenamiento', days.map(d => { const id = planDay(d), s = SESIONES[id], on = !!(w.entreno[d] && w.entreno[d].done);
      return `<td><button class="cell ${s.tipo === 'descanso' ? '' : 'sched'}" data-act="train-done" data-day="${d}" aria-pressed="${on}" aria-label="${esc(s.nombre)}, ${DOW_LONG[dow(d)]}" title="${esc(s.nombre)}" ${d > TODAY ? 'disabled' : ''}></button></td>`; }).join(''),
      (() => { const pl = days.filter(d => SESIONES[planDay(d)].tipo !== 'descanso'); return `${pl.filter(d => w.entreno[d] && w.entreno[d].done).length}/${pl.length}`; })(), false) : '';
  const groups = Object.keys(FRENTES).map(f => {
    const chs = f === 'hogar' ? activeChores() : [];
    const rows = activeAnchors().filter(a => a.area === f).map(anchorRow).join('')
      + (f === 'salud' ? trainRow + sleepRow + ocioRow : '')
      + chs.map(choreRow).join('')
      + activeRhythms().filter(r => r.area === f).map(rhythmRow).join('');
    return rows ? `<tr class="grp"><th colspan="9">${FRENTES[f]}${chs.length ? ' (borde punteado = toca limpiar ese día)' : ''}</th></tr>${rows}` : '';
  }).join('');
  return `<div class="scroll"><table class="matrix">
      <thead><tr><th scope="col"><span class="sr">Hábito</span></th>${days.map(d => `<th scope="col" class="${d === TODAY ? 'is-today' : ''} ${d === S.day ? 'is-sel' : ''}"><button class="colpick" data-act="pick-day" data-day="${d}" ${d > TODAY ? 'disabled' : ''} aria-label="Ver el ${DOW_LONG[dow(d)]} ${parse(d).getDate()}">${DOW[dow(d)]}<small>${parse(d).getDate()}</small></button></th>`).join('')}<th scope="col">Total</th></tr></thead>
      <tbody>${groups}</tbody>
    </table></div>`;
}

/** The day's habits, grouped by front. Each front holds its daily anchors, its weekly rhythms and its own extras. */
function frontsBlock(d){
  const m = mondayOf(d), w = week(m), x = day(d), sc = scoreWeek(m), isToday = d === TODAY;
  const sl = weekSleep(m), ocW = weekOcio(m), budget = S.cfg.ocioBudgetH * 60;
  const ocPct = budget ? Math.min(100, ocW / budget * 100) : 0, ocBy = weekOcioBy(m);
  const pick = S.cfg.ocioTypes.some(t => t.id === S.ocioPick) ? S.ocioPick : S.cfg.ocioTypes[0].id, dr = S.ocioDraft;
  const up = upcoming(d), chores = choresFor(d), allChores = activeChores();

  const anchorGrid = list => list.length ? `<div class="sub"><p class="label">Cada día</p><div class="anchors">
      ${list.map(a => { const auto = x.a[a.id] && x.aSrc && x.aSrc[a.id] === 'fitbit';
        return `<button class="anchor" data-act="anchor" data-id="${a.id}" aria-pressed="${!!x.a[a.id]}">
        <span class="a-label"><span class="tick"></span>${esc(a.label)}</span>${a.hint ? `<span class="a-hint">${esc(a.hint)}</span>` : ''}${auto ? '<span class="ftag">Marcado por tu Fitbit</span>' : ''}</button>`; }).join('')}
    </div></div>` : '';
  const rhythmList = list => list.length ? `<div class="sub"><p class="label">Esta semana, sin día fijo</p><ul class="rhythms">
      ${list.map(r => { const arr = w.rhythms[r.id] || [], on = arr.includes(d), n = arr.length;
        return `<li><button class="rhythm ${n >= r.target ? 'met' : ''}" data-act="rhythm" data-id="${r.id}" data-day="${d}" aria-pressed="${on}">
          <span class="r-label">${esc(r.label)}</span>
          <span class="dots" aria-label="${n} de ${r.target}">${dots(n, r.target)}</span></button></li>`; }).join('')}
    </ul></div>` : '';

  const fs = x.fit && x.fit.sue;
  const sleepLine = x.sleepSrc === 'fitbit' && fs
    ? `<p class="fitline"><span class="ftag">Fitbit</span> ${fmtHM(fs.min)} dormido${fs.a && fs.d ? ` · de ${esc(fs.a)} a ${esc(fs.d)}` : ''}</p>`
    : x.sleepSrc === 'manual' && fs ? `<button class="linkbtn" data-act="sleep-fit">Usar el dato de Fitbit (${fmtHM(fs.min)})</button>` : '';
  const sleep = `<div class="sub sleepbox"><p class="label">Dormí anoche</p>
      ${sleepLine}
      <div class="chips">${SLEEP_OPTS.map(([v,l]) => `<button class="chip" data-act="sleep" data-v="${v}" aria-pressed="${x.sleep === v}">${l}</button>`).join('')}</div>
      <p class="meta">Meta: ${fmtNum(S.cfg.sleepTarget,1)} h${sl.length ? ` · promedio de la semana: ${fmtNum(avg(sl),1)} h` : ''}</p></div>`;

  const ocio = `<div class="sub"><p class="label">Ocio elegido</p>
    <p class="hint">Lo que elegiste para descansar, con su duración real. Límite: ${fmtNum(S.cfg.ocioBudgetH,1)} h por semana.</p>
    ${x.ocioLog.length ? `<ul class="ocio-log">${x.ocioLog.map(e => `<li>
      <span class="otag">${esc(ocioLabel(e))}</span><span class="dur">${fmtMin(e.min)}</span><span class="que">${esc(e.q || '')}</span>
      <button class="x" data-act="ocio-del" data-id="${esc(e.id)}" aria-label="Quitar ${esc(ocioEntryText(e))}">×</button></li>`).join('')}</ul>` : ''}
    <form class="ocio-form" data-form="ocio">
      <div class="chips" role="group" aria-label="Tipo de ocio">${S.cfg.ocioTypes.map(t => `<button type="button" class="chip" data-act="ocio-type" data-id="${esc(t.id)}" aria-pressed="${pick === t.id}">${esc(t.label)}</button>`).join('')}</div>
      <div class="row">
        <span class="dur-in">
          <label class="sr" for="oh">Horas</label><input type="number" id="oh" data-bind="ocio-draft" data-k="h" min="0" max="12" inputmode="numeric" value="${esc(dr.h)}" placeholder="0"> h
          <label class="sr" for="om">Minutos</label><input type="number" id="om" data-bind="ocio-draft" data-k="m" min="0" max="59" inputmode="numeric" value="${esc(dr.m)}" placeholder="0"> min
        </span>
        <label class="sr" for="oq">Qué fue</label><input type="text" id="oq" data-bind="ocio-draft" data-k="q" value="${esc(dr.q)}" maxlength="80" placeholder="¿Qué fue? (opcional)" autocomplete="off">
      </div>
      <button class="btn">Anotar</button>
    </form>
    <div class="meter ${ocW > budget ? 'over' : ''}" role="img" aria-label="${fmtMin(ocW)} de ${S.cfg.ocioBudgetH} horas"><span style="width:${ocPct}%"></span></div>
    <p class="meta">${fmtMin(ocW)} de ${fmtNum(S.cfg.ocioBudgetH,1)} h esta semana${ocioByText(ocBy) ? ' · ' + ocioByText(ocBy) : ''}${ocW > budget ? '. Pasaste el límite: es un dato, no una falta.' : ''}</p>
  </div>`;

  const dates = `<div class="sub"><p class="label">Fechas clave</p>
    ${up.length ? `<ul class="dates">${up.map(u => dateRow(u)).join('')}</ul>`
      : `<p class="hint">${S.cfg.keyDates.length ? 'Nada vence en los próximos diez días.' : 'Añade una vez la renta, los créditos y los cobros en <a href="#mes">Mes</a>, y aparecerán aquí cuando se acerquen.'}</p>`}
  </div>`;

  const cleaning = allChores.length ? `<div class="sub"><p class="label">Limpieza, días fijos</p>
    <p class="hint">${allChores.map(c => `${esc(c.label)}: ${choreDaysText(c)}`).join(' · ')}</p>
    ${chores.length ? `<ul class="rhythms">${chores.map(({c, doneToday, note}) => `<li><button class="rhythm" data-act="chore" data-id="${c.id}" data-day="${d}" aria-pressed="${doneToday}">
        <span class="r-label">${esc(c.label)}<span class="r-area">${note}</span></span></button></li>`).join('')}</ul>`
      : `<p class="empty">${isToday ? 'Hoy' : 'Ese día'} no toca limpieza.${nextChore(d) ? ' Lo próximo: ' + esc(nextChore(d)) + '.' : ''}</p>`}
  </div>` : '';

  const extras = {salud:{before:trainingBlock(d) + sleep + fitBlock(x), after:ocio}, finanzas:{after:dates}, hogar:{before:cleaning}};
  return Object.keys(FRENTES).map(f => {
    const an = activeAnchors().filter(a => a.area === f), rh = activeRhythms().filter(r => r.area === f), ex = extras[f] || {};
    if (!an.length && !rh.length && !ex.before && !ex.after) return '';
    const v = sc && typeof sc.areas[f] === 'number' ? sc.areas[f] : null;
    return `<section class="block front" id="f-${f}">
      <div class="front-h"><h2>${FRENTES[f]}</h2>${v === null ? '' : `<span class="fscore">${pct(v)} esta semana</span>`}</div>
      <p class="hint">${FRENTE_DESC[f]}</p>
      ${anchorGrid(an)}${ex.before || ''}${rhythmList(rh)}${ex.after || ''}
    </section>`;
  }).join('');
}

function viewHoy(){
  const d = S.day, m = mondayOf(d), w = week(m), x = day(d), days = weekDays(m);
  const principle = PRINCIPLES[(diffDays('2026-01-01', d) % PRINCIPLES.length + PRINCIPLES.length) % PRINCIPLES.length];
  const focus = w.plan.focus.filter(Boolean);
  const isCurWeek = m === mondayOf(TODAY), pastWeek = m < mondayOf(TODAY);
  const sc = scoreWeek(m);
  const prev = S.weeks[mondayOf(addDays(d,-1))] && S.weeks[mondayOf(addDays(d,-1))].days[addDays(d,-1)];
  const carry = prev ? prev.three.filter(t => t.t.trim() && !t.d) : [];
  const freeSlots = x.three.filter(t => !t.t.trim()).length;
  const anchors = activeAnchors(), rh = activeRhythms();

  const sl = weekSleep(m), ocW = weekOcio(m), budget = S.cfg.ocioBudgetH * 60;
  const ocPct = budget ? Math.min(100, ocW / budget * 100) : 0;
  const ocBy = weekOcioBy(m);
  const pick = S.cfg.ocioTypes.some(t => t.id === S.ocioPick) ? S.ocioPick : S.cfg.ocioTypes[0].id, dr = S.ocioDraft;
  const up = upcoming(d);
  const chores = choresFor(d), allChores = activeChores();
  const todoOpen = S.todo.items.filter(t => !t.done), todoDone = S.todo.items.filter(t => t.done && t.doneOn === d);

  const autoDone = [
    ...x.three.filter(t => t.d && t.t.trim()).map(t => t.t),
    ...anchors.filter(a => x.a[a.id]).map(a => a.label),
    ...rh.filter(r => (w.rhythms[r.id] || []).includes(d)).map(r => r.label),
    ...allChores.filter(c => (w.chores[c.id] || []).includes(d)).map(c => c.label),
    ...todoDone.map(t => t.t),
    ...(hasPlan() && w.entreno[d] && w.entreno[d].done ? [SESIONES[planDay(d)].nombre] : [])
  ];

  const ritual = d === TODAY && dow(d) === 6 ? `<div class="ritual">
      <p><b>Hoy toca el ritual del domingo.</b> Diez minutos para cerrar esta semana y elegir lo importante de la próxima.</p>
      <div class="row"><a class="pill solid" href="#semana">Ir a Semana</a></div>
    </div>` : '';
  return `
  <section class="dayhead">
    <h1>${d === TODAY ? 'Hoy, ' + fmtLong(d).toLowerCase() : fmtLong(d)}</h1>
    ${d !== TODAY ? '<button class="linkbtn" data-act="day-today">Volver a hoy</button>' : ''}
    <p class="principle">${esc(principle)}</p>
  </section>

  <section class="weekbox" aria-label="Semana">
    <div class="wkhead">
      <button class="navbtn" data-act="week" data-n="-1" aria-label="Semana anterior" ${m <= MIN_MONDAY ? 'disabled' : ''}>‹</button>
      <span class="lbl">${isCurWeek ? 'Esta semana' : 'Semana'} · ${parse(days[0]).getDate()} ${fmtDM(days[0]).split(' ')[1]} – ${fmtDM(days[6])}</span>
      <button class="navbtn" data-act="week" data-n="1" aria-label="Semana siguiente" ${isCurWeek ? 'disabled' : ''}>›</button>
    </div>
    <div class="wstrip">${days.map(dd => `<button class="wday ${dd === TODAY ? 'today' : ''}" data-act="pick-day" data-day="${dd}" aria-pressed="${dd === d}" ${dd > TODAY ? 'disabled' : ''} aria-label="${DOW_LONG[dow(dd)]} ${parse(dd).getDate()}${dd === TODAY ? ', hoy' : ''}">
      <small>${DOW[dow(dd)]}</small><b>${parse(dd).getDate()}</b><span class="wb"><i style="width:${Math.round(dayProgress(w, dd) * 100)}%"></i></span></button>`).join('')}</div>
    <p class="meta">Balance ${sc ? pct(sc.overall) + (sc.complete ? '' : ' (en curso)') : '–'} · Sueño ${sl.length ? fmtNum(avg(sl),1) + ' h' : '–'} · Ocio ${fmtMin(ocW)} de ${fmtNum(S.cfg.ocioBudgetH,1)} h</p>
  </section>

  <section class="block">
    ${focus.length ? `<p class="weekfocus"><span class="label">Esta semana importa</span>${focus.map(f => `<span class="it">${esc(f)}</span>`).join('')}</p>`
      : '<p class="hint">Aún no eliges lo importante de esta semana. <a href="#semana">Hazlo en Semana</a>.</p>'}
  </section>
  ${ritual}
  ${agendaBlock(d)}

  <section class="block">
    <div class="block-h"><h2>Lo importante ${d === TODAY ? 'hoy' : 'ese día'}</h2><span class="hint">Máximo tres. Si entra algo nuevo, algo sale.</span></div>
    <ul class="three">
      ${x.three.slice(0,3).map((t,i) => `<li class="${t.d ? 'is-done' : ''}">
        <button class="check" data-act="three" data-i="${i}" aria-pressed="${!!t.d}" aria-label="Marcar como hecho">✓</button>
        <label class="sr" for="three-${i}">Prioridad ${i+1}</label>
        <input id="three-${i}" data-bind="three" data-i="${i}" value="${esc(t.t)}" placeholder="${THREE_PH[i]}" maxlength="120" autocomplete="off">
      </li>`).join('')}
    </ul>
    ${carry.length && freeSlots ? `<button class="linkbtn" data-act="carry">Traer lo que quedó de ayer (${carry.length})</button>` : ''}
  </section>

  ${frontsBlock(d)}

  <section class="block">
    <div class="block-h"><h2>Pendientes varios</h2><span class="hint">Sin fecha ni orden. Cuando hagas uno, márcalo y pasa a Hecho.</span></div>
    ${todoOpen.length || todoDone.length ? `<ul class="todo">
      ${[...todoOpen, ...todoDone].map(t => `<li class="${t.done ? 'is-done' : ''}">
        <button class="check" data-act="todo" data-id="${t.id}" aria-pressed="${t.done}" aria-label="${t.done ? 'Marcar como pendiente' : 'Marcar como hecho'}">✓</button>
        <span class="t">${esc(t.t)}</span>
        ${S.confirm === 'todo:' + t.id ? `<button class="pill danger" data-act="todo-del-yes" data-id="${t.id}">Eliminar</button><button class="pill" data-act="confirm-no">Cancelar</button>`
          : `<button class="x" data-act="todo-del" data-id="${t.id}" aria-label="Eliminar ${esc(t.t)}">×</button>`}
      </li>`).join('')}
    </ul>` : '<p class="empty">Nada pendiente por ahora.</p>'}
    ${todoOpen.length > 7 ? '<p class="hint">La lista va creciendo. ¿Hay algo que puedas soltar?</p>' : ''}
    <form class="add" data-form="todo">
      <label class="sr" for="todo-new">Nuevo pendiente</label>
      <input id="todo-new" placeholder="Nuevo pendiente…" maxlength="120" autocomplete="off">
      <button class="btn ghost">Añadir</button>
    </form>
  </section>

  <section class="block">
    <div class="block-h"><h2>Hecho ${d === TODAY ? 'hoy' : 'ese día'}</h2><span class="hint">Cierra el día con lo que sí hiciste.</span></div>
    ${autoDone.length || x.done.length ? `<ul class="donelist">
      ${autoDone.map(t => `<li class="auto">${esc(t)}</li>`).join('')}
      ${x.done.map((t,i) => `<li>${esc(t)}<button class="x" data-act="done-del" data-i="${i}" aria-label="Quitar">×</button></li>`).join('')}
    </ul>` : '<p class="empty">Todavía nada anotado. Lo que marques arriba aparece aquí solo.</p>'}
    <form class="add" data-form="done">
      <label class="sr" for="done-new">Algo más que hiciste</label>
      <input id="done-new" placeholder="Algo más que hiciste…" maxlength="140" autocomplete="off">
      <button class="btn ghost">Añadir</button>
    </form>
    <div class="stack">
      <label for="note">Una línea para recordar</label>
      <textarea id="note" data-bind="note" rows="2" maxlength="600" placeholder="Algo que dijo Emilia, un momento, una idea…">${esc(x.note)}</textarea>
    </div>
  </section>`;
}

function dots(n, t){
  let s = '';
  for (let i = 0; i < t; i++) s += `<i class="dot ${i < n ? 'on' : ''}"></i>`;
  if (n > t) s += `<b class="extra">+${n-t}</b>`;
  return s;
}
function dateRow(u){
  const kd = u.kd;
  return `<li>
    <span class="when"><b>${parse(u.date).getDate()}</b><small>${fmtDM(u.date).split(' ')[1] || ''}</small></span>
    <span class="what"><span class="kind ${kd.kind}">${kindName(kd.kind)}</span>${esc(kd.name)}
      <small>${whenText(u.dd)}${kd.amount ? ' · ' + esc(kd.amount) : ''}</small></span>
    <button class="pill" data-act="kd" data-id="${kd.id}" data-k="${u.k}" aria-pressed="${u.ok}">${kdLabel(kd, u.ok)}</button>
  </li>`;
}

function viewSemana(){
  const d = S.day, m = mondayOf(d), w = week(m), days = weekDays(m);
  const isCurWeek = m === mondayOf(TODAY), pastWeek = m < mondayOf(TODAY), sc = scoreWeek(m);
  const sl = weekSleep(m), ocW = weekOcio(m);
  const focus = w.plan.focus.filter(Boolean);
  const editingPlan = S.editPlan || !focus.length;
  const planBlock = editingPlan ? `
    <div class="plan3">${[0,1,2].map(i => `<label class="sr" for="pf-${i}">Importante ${i+1}</label><input type="text" id="pf-${i}" data-bind="plan" data-i="${i}" value="${esc(w.plan.focus[i])}" maxlength="80" placeholder="${PLAN_PH[i]}">`).join('')}</div>
    <div class="stack">
      <label for="pskip">Esta semana dejo ir, a propósito</label>
      <input type="text" id="pskip" data-bind="skip" value="${esc(w.plan.skip)}" maxlength="120" placeholder="Ej.: ordenar el garaje, el curso nuevo, responder todo al instante">
      <span class="hint">Elegir de antemano en qué quedarte corto es una decisión, no un fracaso.</span>
    </div>
    ${focus.length ? '<button class="pill" data-act="plan-done">Listo</button>' : ''}`
    : `<p class="weekfocus">${focus.map(f => `<span class="it">${esc(f)}</span>`).join('')}</p>
    ${w.plan.skip ? `<p class="meta">Dejo ir: ${esc(w.plan.skip)}</p>` : ''}
    <button class="linkbtn" data-act="plan-edit">Editar</button>`;

  // Training for the week.
  let training;
  if (!hasPlan() || S.pickPlan){
    training = `<p class="hint">Elige un plan. Después puedes cambiar la sesión de cualquier día desde Hoy, o ajustar el plan en Ajustes.</p>
      <div class="planpick">${Object.entries(PLANES).map(([id, p]) => `<div class="pcard ${S.cfg.training.plan === id ? 'current' : ''}">
        <h3>${esc(p.nombre)}</h3><p class="hint">${esc(p.resumen)}</p>
        <ol class="pdays">${p.dias.map((s, i) => `<li><b>${DOW[i]}</b> ${esc(SESIONES[s].nombre)}</li>`).join('')}</ol>
        <button class="pill ${S.cfg.training.plan === id ? '' : 'solid'}" data-act="plan-pick" data-id="${id}">${S.cfg.training.plan === id ? 'Plan actual' : 'Elegir este plan'}</button></div>`).join('')}</div>
      ${hasPlan() ? '<button class="linkbtn" data-act="plan-change">Cancelar</button>' : ''}`;
  } else {
    const planned = days.filter(dd => dd <= TODAY && SESIONES[planDay(dd)].tipo !== 'descanso');
    const done = planned.filter(dd => w.entreno[dd] && w.entreno[dd].done).length;
    training = `<p class="meta">Plan «${esc(PLANES[S.cfg.training.plan] ? PLANES[S.cfg.training.plan].nombre : 'personalizado')}» · ${done} de ${planned.length} sesiones hechas hasta hoy</p>
      <div class="scroll"><table class="sched"><tbody>${days.map(dd => {
        const id = planDay(dd), s = SESIONES[id], e = w.entreno[dd] || {};
        return `<tr class="${dd === TODAY ? 'is-today' : ''}"><th scope="row">${cap(DOW_LONG[dow(dd)])} ${parse(dd).getDate()}</th>
          <td><span class="stype ${s.tipo}">${esc(s.nombre)}</span>${e.cambio ? ' <span class="meta">(cambiada)</span>' : ''}</td>
          <td class="st">${s.tipo === 'descanso' ? '<span class="meta">Descanso</span>'

  <section class="block" id="cierre">

    <div class="stack"><label for="rev-adjust">Qué ajusto para la próxima</label><textarea id="rev-adjust" data-bind="review" data-k="adjust" maxlength="600">${esc(w.review.adjust)}</textarea></div>`
    : '<button class="linkbtn" data-act="show-review">Escribir el cierre ahora</button>'}
  </section>
  ${nextPlan}`;
